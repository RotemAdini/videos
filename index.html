      display: inline-flex;
      align-items: center;
      min-height: 38px;
      cursor: pointer;
    }

    .tag-choice input {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }

    .tag-choice span {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0.35rem 0.72rem;
      border-radius: 999px;
      border: 1px solid rgba(124, 58, 237, 0.12);
      background: rgba(124, 58, 237, 0.05);
      color: var(--accent-strong);
      font-size: 0.8rem;
      font-weight: 700;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .tag-choice input:checked + span {
      background: rgba(124, 58, 237, 0.16);
      border-color: rgba(124, 58, 237, 0.28);
      color: #4c1d95;
    }

    .tag-choice input:focus-visible + span {
      outline: 2px solid rgba(124, 58, 237, 0.25);
      outline-offset: 2px;
    }

    dialog.settings-dialog {
      width: min(980px, calc(100% - 0.9rem));
      max-height: min(94vh, 980px);
    }

    .settings-shell {
      display: grid;
      gap: 0.75rem;
      max-height: min(88vh, 920px);
      overflow: auto;
    }

    .settings-sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      align-items: start;
    }

    .settings-group {
      padding: 0.8rem;
      border-radius: 18px;
      border: 1px solid rgba(91, 33, 182, 0.08);
      background: rgba(124, 58, 237, 0.035);
      display: grid;
      gap: 0.6rem;
    }

    .settings-group h3 {
      margin: 0;
      font-size: 0.92rem;
    }

    .settings-actions,
    .wrap-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }

    .settings-chip.active {
      background: rgba(124, 58, 237, 0.15);
      border-color: rgba(124, 58, 237, 0.22);
      color: #4c1d95;
    }

    .color-explainer {
      display: grid;
      gap: 0.45rem;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .color-green { background: #22c55e; }
    .color-orange { background: #f97316; }
    .color-red { background: #ef4444; }
    .color-yellow { background: #eab308; }
    .color-purple { background: #7c3aed; }
    .color-lavender { background: #a78bfa; }
    .color-tag { background: linear-gradient(135deg, #ec4899, #8b5cf6); }

    .tone-ideas {
      --tone: rgba(244, 114, 182, 0.09);
    }

    .tone-scheduled {
      --tone: rgba(249, 115, 22, 0.1);
    }

    .tone-filmed {
      --tone: rgba(234, 179, 8, 0.1);
    }

    .tone-dubbing,
    .tone-edit {
      --tone: rgba(99, 102, 241, 0.09);
    }

    .tone-ready {
      --tone: rgba(34, 197, 94, 0.1);
    }

    .tone-published {
      --tone: rgba(148, 163, 184, 0.09);
    }

    .tone-hold {
      --tone: rgba(167, 139, 250, 0.1);
    }

    .priority-pill.red {
      background: rgba(244, 63, 94, 0.13);
      color: #be123c;
    }

    .priority-pill.yellow {
      background: rgba(245, 158, 11, 0.14);
      color: #b45309;
    }

    .priority-pill.green {
      background: rgba(14, 165, 233, 0.14);
      color: #0369a1;
    }

    .item-card.priority-green,
    .schedule-item.priority-green {
      box-shadow: inset 4px 0 0 #0ea5e9;
    }

    .deadline-soon {
      box-shadow: inset 4px 0 0 #f97316;
      background: rgba(249, 115, 22, 0.03);
    }

    .deadline-urgent {
      box-shadow: inset 4px 0 0 #ef4444;
      background: rgba(239, 68, 68, 0.04);
    }

    .tiny-pill.deadline-soon-pill {
      background: rgba(249, 115, 22, 0.14);
      color: #c2410c;
    }

    .tiny-pill.deadline-urgent-pill {
      background: rgba(239, 68, 68, 0.14);
      color: #b91c1c;
    }

    .stage-dubbing {
      background: #6366f1;
    }

    .stage-hold {
      background: #a78bfa;
    }

    .stage-published {
      background: #94a3b8;
    }

    .legend-pill.status-edit,
    .calendar-pill.status-edit {
      background: rgba(99, 102, 241, 0.16);
      color: #4338ca;
    }

    .legend-pill.status-hold,
    .calendar-pill.status-hold {
      background: rgba(167, 139, 250, 0.18);
      color: #6d28d9;
    }

    .day-video-item.status-hold {
      box-shadow: inset 4px 0 0 rgba(167, 139, 250, 0.55);
    }

    .day-video-item.status-published {
      box-shadow: inset 4px 0 0 rgba(148, 163, 184, 0.5);
    }

    .calendar-actions {
      align-items: center;
    }

    .calendar-actions .dialog-close-btn {
      margin-inline-start: auto;
    }

    @media (max-width: 860px) {
      .settings-sections {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .compact-item-grid,
      .settings-sections {
        grid-template-columns: 1fr;
      }
    }

    /* Calendar */
    dialog.calendar-dialog {
      width: min(100%, 1120px);
      max-width: 1120px;
      min-height: 100vh;
      max-height: 100vh;
      margin: 0 auto;
      border-radius: 0;
      background:
        radial-gradient(circle at top right, rgba(167, 139, 250, 0.18), transparent 32%),
        linear-gradient(180deg, rgba(253, 249, 255, 0.99), rgba(244, 237, 255, 0.99));
    }

    .calendar-shell {
      display: grid;
      gap: 0.85rem;
      min-height: calc(100vh - 2rem);
    }

    .calendar-topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: grid;
      gap: 0.7rem;
      padding-bottom: 0.1rem;
      background: linear-gradient(180deg, rgba(252, 248, 255, 0.98), rgba(252, 248, 255, 0.88));
      backdrop-filter: blur(10px);
    }

    .calendar-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .calendar-nav {
      flex: 1 1 320px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 0.55rem;
      padding: 0.35rem;
      border-radius: 22px;
      border: 1px solid rgba(91, 33, 182, 0.08);
      background: rgba(255, 255, 255, 0.78);
    }

    .calendar-nav-title {
      min-width: 0;
      text-align: center;
    }

    .calendar-nav-title h2 {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.15;
    }

    .calendar-nav-title small {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .calendar-nav-btn {
      width: 50px;
      min-width: 50px;
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      background: rgba(124, 58, 237, 0.12);
      color: var(--accent-strong);
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgba(91, 33, 182, 0.08);
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .calendar-nav-btn:hover,
    .calendar-nav-btn:focus-visible,
    .calendar-chip:hover,
    .calendar-chip:focus-visible,
    .calendar-video-pill:hover,
    .calendar-video-pill:focus-visible {
      background: rgba(124, 58, 237, 0.16);
      outline: none;
    }

    .calendar-nav-btn:active,
    .calendar-chip:active,
    .calendar-video-pill:active,
    .calendar-cell:active {
      transform: scale(0.98);
    }

    .calendar-top-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .calendar-today-btn {
      min-height: 44px;
      border-radius: 16px;
      padding-inline: 0.95rem;
      background: rgba(255, 255, 255, 0.86);
    }

    .calendar-toolbar {
      display: grid;
      gap: 0.55rem;
    }

    .calendar-view-switch,
    .calendar-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .calendar-chip {
      min-height: 36px;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(91, 33, 182, 0.08);
      background: rgba(255, 255, 255, 0.76);
      color: var(--accent-strong);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .calendar-chip.active {
      background: rgba(124, 58, 237, 0.14);
      border-color: rgba(124, 58, 237, 0.16);
    }

    .calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
    }

    .calendar-grid.month-mode,
    .calendar-grid.week-mode {
      grid-template-columns: 1fr;
    }

    .calendar-grid.year-mode {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .calendar-month,
    .calendar-week-board {
      border-radius: 24px;
      border: 1px solid rgba(91, 33, 182, 0.08);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: none;
    }

    .calendar-month {
      padding: 0.8rem;
    }

    .calendar-week-board {
      padding: 0.7rem;
    }

    .calendar-month-head {
      margin-bottom: 0.5rem;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.38rem;
    }

    .calendar-weekdays {
      margin-bottom: 0.42rem;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
    }

    .calendar-week-list {
      display: grid;
      gap: 0.55rem;
    }

    .calendar-cell {
      position: relative;
      display: grid;
      align-content: start;
      gap: 0.35rem;
      width: 100%;
      min-height: 108px;
      padding: 0.5rem;
      border-radius: 18px;
      border: 1px solid rgba(91, 33, 182, 0.07);
      background: rgba(124, 58, 237, 0.035);
      text-align: right;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .calendar-cell:focus-visible {
      outline: 2px solid rgba(124, 58, 237, 0.45);
      outline-offset: 2px;
    }

    .calendar-cell.empty {
      min-height: 0;
      border: 0;
      background: transparent;
      cursor: default;
    }

    .calendar-cell.today {
      border-color: rgba(124, 58, 237, 0.34);
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.14), rgba(255, 255, 255, 0.9));
      box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.12);
    }

    .calendar-cell.week-cell {
      min-height: 128px;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.92);
    }

    .calendar-cell.calendar-day-busy {
      border-color: rgba(249, 115, 22, 0.18);
    }

    .calendar-cell.calendar-day-urgent {
      border-color: rgba(239, 68, 68, 0.2);
      background: linear-gradient(180deg, rgba(254, 242, 242, 0.88), rgba(255, 255, 255, 0.92));
    }

    .calendar-cell.calendar-day-filming {
      box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.12);
    }

    .calendar-cell-top,
    .calendar-day-heading,
    .calendar-day-flags,
    .calendar-summary,
    .day-sheet-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .calendar-day-heading {
      justify-content: flex-start;
    }

    .calendar-weekday-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .calendar-date {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 900;
      color: var(--accent-strong);
    }

    .calendar-summary {
      justify-content: flex-start;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .calendar-flag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.66rem;
      font-weight: 800;
    }

    .calendar-flag.urgent {
      background: rgba(239, 68, 68, 0.12);
      color: #b91c1c;
    }

    .calendar-flag.busy {
      background: rgba(249, 115, 22, 0.12);
      color: #c2410c;
    }

    .calendar-events {
      display: grid;
      gap: 0.18rem;
      align-content: start;
    }

    .calendar-pill {
      display: flex;
      align-items: flex-start;
      gap: 0.32rem;
      width: 100%;
      min-height: 24px;
      padding: 0.18rem 0.4rem;
      border-radius: 10px;
      border: 0;
      overflow: hidden;
      text-align: right;
      box-shadow: none;
    }

    .calendar-pill-text {
      min-width: 0;
      display: -webkit-box;
      overflow: hidden;
      white-space: normal;
      overflow-wrap: anywhere;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.18;
      font-size: 0.68rem;
      font-weight: 800;
    }

    .calendar-marker {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.7;
    }

    .calendar-video-pill {
      cursor: grab;
      background: rgba(255, 255, 255, 0.95);
    }

    .calendar-video-pill:active {
      cursor: grabbing;
    }

    .calendar-video-pill.calendar-deadline-soon {
      box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.28);
      background: rgba(255, 247, 237, 0.98);
    }

    .calendar-video-pill.calendar-deadline-urgent {
      box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.32);
      background: rgba(254, 242, 242, 0.98);
    }

    .calendar-more {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .legend-pill.status-scheduled,
    .calendar-pill.status-scheduled {
      background: rgba(249, 115, 22, 0.16);
      color: #c2410c;
    }

    .legend-pill.status-edit,
    .calendar-pill.status-edit {
      background: rgba(99, 102, 241, 0.16);
      color: #4338ca;
    }

    .legend-pill.status-hold,
    .calendar-pill.status-hold {
      background: rgba(167, 139, 250, 0.18);
      color: #6d28d9;
    }

    .legend-pill.status-published,
    .calendar-pill.status-published {
      background: rgba(148, 163, 184, 0.16);
      color: #475569;
    }

    .legend-pill.status-ready,
    .calendar-pill.status-ready {
      background: rgba(34, 197, 94, 0.16);
      color: #166534;
    }

    .legend-pill.status-filmed,
    .calendar-pill.status-filmed {
      background: rgba(234, 179, 8, 0.18);
      color: #854d0e;
    }

    .legend-pill.status-early,
    .calendar-pill.status-early {
      background: rgba(244, 114, 182, 0.16);
      color: #be185d;
    }

    .legend-pill.holiday,
    .calendar-pill.holiday,
    .calendar-pill.note {
      background: rgba(124, 58, 237, 0.12);
      color: var(--accent-strong);
    }

    .calendar-pill.filming-day,
    .legend-pill.filming-day {
      background: rgba(249, 115, 22, 0.12);
      color: #c2410c;
    }

    .calendar-pill.filming-day .calendar-marker {
      background: #f97316;
    }

    .calendar-pill.holiday .calendar-marker,
    .calendar-pill.note .calendar-marker {
      background: #7c3aed;
    }

    .calendar-drop-target {
      border-color: rgba(124, 58, 237, 0.34) !important;
      background: rgba(124, 58, 237, 0.09) !important;
      box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.12);
    }

    dialog.day-dialog {
      width: min(720px, calc(100% - 1rem));
      max-height: min(88vh, 860px);
      border-radius: 28px;
      background: rgba(252, 249, 255, 0.99);
    }

    .day-shell {
      position: relative;
      display: grid;
      gap: 0.8rem;
    }

    .day-sheet-handle {
      width: 54px;
      height: 5px;
      margin: 0 auto;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.18);
    }

    .day-sheet-head {
      align-items: start;
      padding-left: 3rem;
    }

    .day-sheet-toolbar {
      justify-content: flex-start;
    }

    @media (max-width: 860px) {
      .calendar-grid.year-mode {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .calendar-nav-row {
        align-items: stretch;
      }

      .calendar-nav,
      .calendar-top-actions {
        width: 100%;
      }

      .calendar-top-actions {
        justify-content: space-between;
      }

      .calendar-cell {
        min-height: 90px;
        padding: 0.45rem;
      }

      .calendar-cell.week-cell {
        min-height: 116px;
      }

      .calendar-days {
        gap: 0.3rem;
      }

      .calendar-pill-text {
        font-size: 0.64rem;
      }

      dialog.day-dialog {
        width: 100%;
        max-width: 100%;
        max-height: 88vh;
        margin: auto auto 0 auto;
        border-radius: 24px 24px 0 0;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <dialog id="itemDialog">
    <form id="itemForm" class="dialog-shell item-form-shell">
      <h2 id="itemDialogTitle" class="visually-hidden">פריט וידאו</h2>
      <button type="button" class="icon-btn dialog-close-btn dialog-corner-btn" data-action="close-dialog" data-dialog-id="itemDialog" aria-label="סגירת עריכת הפריט">✕</button>

      <input type="hidden" name="itemId">

      <div class="dialog-grid compact-item-grid">
        <div class="field full">
          <label for="itemTitle">כותרת</label>
          <input id="itemTitle" class="input" name="title" required maxlength="160" placeholder="למשל: וולוג בוקר יום צילום">
        </div>

        <div class="field">
          <label for="itemCategory">קטגוריה</label>
          <select id="itemCategory" class="select" name="categoryId" required></select>
        </div>

        <div class="field">
          <label for="itemSubcategory">תת־קטגוריה</label>
          <select id="itemSubcategory" class="select" name="subcat"></select>
        </div>

        <div class="field">
          <label for="itemDue">תאריך יעד</label>
          <input id="itemDue" class="input" type="date" name="due">
        </div>

        <div class="field full">
          <label>תגיות</label>
          <div class="tag-choice-grid" id="fixedTagOptions">
            <label class="tag-choice"><input type="checkbox" name="fixedTags" value="מצחיק"><span>מצחיק</span></label>
            <label class="tag-choice"><input type="checkbox" name="fixedTags" value="מתכון"><span>מתכון</span></label>
            <label class="tag-choice"><input type="checkbox" name="fixedTags" value="זוגי"><span>זוגי</span></label>
            <label class="tag-choice"><input type="checkbox" name="fixedTags" value="דייטים א-ב"><span>דייטים א-ב</span></label>
          </div>
        </div>

        <div class="field">
          <label for="itemOutfitRotem">לוק של רותם</label>
          <input id="itemOutfitRotem" class="input" name="outfitRotem" placeholder="לדוגמה: ג׳קט ג׳ינס">
        </div>

        <div class="field">
          <label for="itemOutfitMeir">לוק של מאיר</label>
          <input id="itemOutfitMeir" class="input" name="outfitMeir" placeholder="לדוגמה: חולצה לבנה">
        </div>

        <div class="field full">
          <label for="itemLinks">קישורי השראה</label>
          <textarea id="itemLinks" class="textarea compact-textarea" name="links" placeholder="קישור אחד בכל שורה"></textarea>
        </div>
      </div>

      <div class="dialog-actions compact-item-actions">
        <button type="button" class="btn ghost danger-btn compact-action-btn" id="itemDeleteBtn" data-action="delete-current-item" hidden>מחק</button>
        <button type="submit" class="btn primary compact-action-btn">שמירה</button>
        <button type="button" class="btn ghost compact-action-btn" data-action="close-dialog" data-dialog-id="itemDialog">ביטול</button>
      </div>
    </form>
  </dialog>

  <dialog id="categoryDialog">
    <form id="categoryForm" class="dialog-shell">
      <div class="panel-head dialog-head compact-dialog-head">
        <div>
          <h2 id="categoryDialogTitle">קטגוריה</h2>
          <p class="muted">שם, תפקיד מיוחד, ומצב פתוח או סגור.</p>
        </div>
        <button type="button" class="icon-btn dialog-close-btn" data-action="close-dialog" data-dialog-id="categoryDialog" aria-label="סגירת עריכת הקטגוריה">✕</button>
      </div>

      <input type="hidden" name="categoryId">

      <div class="dialog-grid">
        <div class="field full">
          <label for="categoryTitle">שם הקטגוריה</label>
          <input id="categoryTitle" class="input" name="title" required maxlength="120" placeholder="למשל: עריכה בסיסית">
        </div>

        <div class="field">
          <label for="categoryRole">תפקיד</label>
          <select id="categoryRole" class="select" name="role">
            <option value="">רגילה</option>
            <option value="ready">מוכן לעלייה</option>
            <option value="published">עלה</option>
          </select>
        </div>

        <div class="field">
          <label for="categoryCollapsed">תצוגה</label>
          <div class="checkstack">
            <label class="checkline">
              <input id="categoryCollapsed" type="checkbox" name="collapsed">
              <span>להתחיל במצב מכווץ</span>
            </label>
          </div>
        </div>
      </div>

      <p class="footnote">השם <strong>סדר עלייה ⏰</strong> שמור לתצוגה וירטואלית ולכן לא ניתן להשתמש בו כקטגוריה אמיתית.</p>

      <div class="dialog-actions">
        <button type="submit" class="btn primary">שמירה</button>
        <button type="button" class="btn ghost" data-action="close-dialog" data-dialog-id="categoryDialog">ביטול</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailDialog">
    <div id="detailContent" class="dialog-shell"></div>
  </dialog>

  <dialog id="calendarDialog" class="calendar-dialog">
    <div id="calendarContent" class="dialog-shell"></div>
  </dialog>

  <dialog id="dayDialog" class="day-dialog">
    <div id="dayContent" class="dialog-shell"></div>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog">
    <div id="settingsContent" class="dialog-shell"></div>
  </dialog>

  <input id="importInput" type="file" accept="application/json,.json" hidden>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "video-board-v6";
      const VIRTUAL_SCHEDULE_TITLE = "סדר עלייה ⏰";
      const READY_TITLE = "מוכן לעלייה";
      const PUBLISHED_TITLE = "עלה";
      const HOLD_TITLE = "מתלבטת";
      const DUBBING_TITLE = "צריך לדובב";
      const FIXED_TAG_OPTIONS = ["מצחיק", "מתכון", "זוגי", "דייטים א-ב"];
      const WORKFLOW_STAGE_TITLES = ["רעיונות", "נקבע תאריך", "צילמנו", "עריכה בסיסית", READY_TITLE, PUBLISHED_TITLE];
      const HOLIDAYS = [
        { date: "2026-04-22", title: "יום העצמאות" },
        { date: "2026-09-11", title: "ראש השנה" },
        { date: "2026-09-20", title: "יום כיפור" }
      ];
      const MONTH_NAMES = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
      const WEEKDAY_SHORT = ["א", "ב", "ג", "ד", "ה", "ו", "ש"];
      const CALENDAR_FILTER_OPTIONS = [
        { value: "all", label: "הכל" },
        { value: "ready", label: "מוכן" },
        { value: "urgent", label: "דחוף" },
        { value: "filming", label: "ימי צילום" },
        { value: "important", label: "חשוב" }
      ];
      const DAY_FORMATTER = new Intl.DateTimeFormat("he-IL", { weekday: "long" });
      const DATE_FORMATTER = new Intl.DateTimeFormat("he-IL", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });

      const refs = {
        app: document.getElementById("app"),
        itemDialog: document.getElementById("itemDialog"),
        itemForm: document.getElementById("itemForm"),
        categoryDialog: document.getElementById("categoryDialog"),
        categoryForm: document.getElementById("categoryForm"),
        detailDialog: document.getElementById("detailDialog"),
        detailContent: document.getElementById("detailContent"),
        calendarDialog: document.getElementById("calendarDialog"),
        calendarContent: document.getElementById("calendarContent"),
        dayDialog: document.getElementById("dayDialog"),
        dayContent: document.getElementById("dayContent"),
        settingsDialog: document.getElementById("settingsDialog"),
        settingsContent: document.getElementById("settingsContent"),
        importInput: document.getElementById("importInput")
      };

      const initialDate = new Date();
      const state = {
        board: loadBoard(),
        filters: {
          search: "",
          tag: "all",
          upcomingRange: "all"
        },
        drag: null,
        editingItemId: null,
        editingCategoryId: null,
        openItemMenuKey: null,
        topMenuOpen: false,
        filtersPanelOpen: false,
        searchOpen: false,
        categoryManagerOpen: false,
        focusCategoryId: null,
        openWorkOnly: false,
        floatingMenu: null,
        calendarYear: initialDate.getFullYear(),
        calendarMonth: initialDate.getMonth(),
        calendarFocusDate: `${initialDate.getFullYear()}-${String(initialDate.getMonth() + 1).padStart(2, "0")}-${String(initialDate.getDate()).padStart(2, "0")}`,
        calendarDayDate: "",
        calendarFilter: "all",
        touchGesture: null,
        dialogReturn: null,
        undoToast: null,
        noticeToast: null,
        dropHint: null
      };

      commit({ saveOnly: true });
      bindEvents();

      function bindEvents() {
        document.addEventListener("click", handleClick);
        document.addEventListener("keydown", handleKeydown);
        document.addEventListener("submit", handleSubmit);
        document.addEventListener("change", handleChange);
        document.addEventListener("input", handleInput);
        document.addEventListener("dragstart", handleDragStart);
        document.addEventListener("dragover", handleDragOver);
        document.addEventListener("drop", handleDrop);
        document.addEventListener("dragend", clearDragState);
        document.addEventListener("touchstart", handleTouchStart, { passive: true });
        document.addEventListener("touchend", handleTouchEnd, { passive: true });
        refs.importInput.addEventListener("change", handleImportFile);
      }

      function closeUiMenus() {
        state.openItemMenuKey = null;
        state.topMenuOpen = false;
        state.floatingMenu = null;
      }

      function loadBoard() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return defaultBoard();
          }
          return normalizeBoard(JSON.parse(raw));
        } catch (error) {
          return defaultBoard();
        }
      }

      function defaultBoard() {
        return {
          tasks: [],
          tagColors: {},
          scheduleManual: [],
          calendarDates: [],
          categories: [
            makeCategory("רעיונות"),
            makeCategory("נקבע תאריך"),
            makeCategory("צילמנו"),
            makeCategory("עריכה בסיסית"),
            makeCategory(HOLD_TITLE),
            makeCategory(READY_TITLE, "ready"),
            makeCategory(PUBLISHED_TITLE, "published")
          ],
          ui: {
            compact: false,
            scheduleCollapsed: false,
            tasksCollapsed: false,
            tagsCollapsed: true,
            hideCompletedTasks: false,
            calendarView: "month"
          }
        };
      }

      function makeCategory(title, role = "") {
        return {
          id: createId("cat"),
          title,
          collapsed: false,
          role,
          subcategories: [],
          items: []
        };
      }

      function normalizeBoard(raw) {
        const board = raw && typeof raw === "object" ? raw : {};
        const fallback = defaultBoard();
        const categoriesSource = Array.isArray(board.categories) && board.categories.length ? board.categories : fallback.categories;

        const normalized = {
          tasks: normalizeTasks(board.tasks),
          tagColors: normalizeTagColors(board.tagColors),
          scheduleManual: Array.isArray(board.scheduleManual) ? board.scheduleManual.filter(isNonEmptyString) : [],
          calendarDates: normalizeCalendarDates(board.calendarDates),
          categories: categoriesSource.map(normalizeCategory).filter(Boolean),
          ui: {
            compact: Boolean(board.ui && board.ui.compact),
            scheduleCollapsed: Boolean(board.ui && board.ui.scheduleCollapsed),
            tasksCollapsed: Boolean(board.ui && board.ui.tasksCollapsed),
            tagsCollapsed: board.ui && typeof board.ui.tagsCollapsed === "boolean" ? board.ui.tagsCollapsed : true,
            hideCompletedTasks: Boolean(board.ui && board.ui.hideCompletedTasks),
            calendarView: board.ui && ["month", "week", "year"].includes(board.ui.calendarView) ? board.ui.calendarView : "month"
          }
        };

        ensureCategoryExists(normalized.categories, HOLD_TITLE, PUBLISHED_TITLE);

        if (!normalized.categories.length) {
          normalized.categories = fallback.categories;
        }

        return normalized;
      }

      function ensureCategoryExists(categories, title, beforeTitle = "") {
        if (categories.some((category) => category.title === title)) {
          return;
        }

        const nextCategory = makeCategory(title);
        const insertIndex = beforeTitle ? categories.findIndex((category) => category.title === beforeTitle) : -1;
        if (insertIndex >= 0) {
          categories.splice(insertIndex, 0, nextCategory);
        } else {
          categories.push(nextCategory);
        }
      }

      function normalizeCalendarDates(calendarDates) {
        if (!Array.isArray(calendarDates)) {
          return [];
        }

        return calendarDates.map((entry) => {
          if (!entry || typeof entry !== "object") {
            return null;
          }

          const date = normalizeDateValue(entry.date);
          const title = String(entry.title || "").trim();
          if (!date || !title) {
            return null;
          }

          return {
            id: isNonEmptyString(entry.id) ? entry.id : createId("date"),
            date,
            title,
            type: normalizeCalendarDateType(entry.type)
          };
        }).filter(Boolean);
      }

      function normalizeCalendarDateType(type) {
        return type === "filming-day" ? "filming-day" : "note";
      }

      function normalizeTasks(tasks) {
        if (!Array.isArray(tasks)) {
          return [];
        }

        return tasks.map((task) => {
          if (typeof task === "string") {
            const text = task.trim();
            return text ? { id: createId("task"), text, done: false } : null;
          }

          if (!task || typeof task !== "object") {
            return null;
          }

          const text = String(task.text || "").trim();
          if (!text) {
            return null;
          }

          return {
            id: isNonEmptyString(task.id) ? task.id : createId("task"),
            text,
            done: Boolean(task.done)
          };
        }).filter(Boolean);
      }

      function normalizeTagColors(tagColors) {
        const safe = {};
        if (!tagColors || typeof tagColors !== "object") {
          return safe;
        }

        Object.entries(tagColors).forEach(([tag, color]) => {
          const cleanTag = normalizeTagName(tag);
          if (!cleanTag) {
            return;
          }
          if (!safe[cleanTag]) {
            safe[cleanTag] = sanitizeColor(color, colorFromString(cleanTag));
          }
        });

        return safe;
      }

      function normalizeCategory(category) {
        if (!category || typeof category !== "object") {
          return null;
        }

        const title = String(category.title || "").trim() || "קטגוריה";
        const role = normalizeRole(category.role, title);
        const subcategories = normalizeSubcategories(category.subcategories);
        const subcategoryIds = new Set(subcategories.map((sub) => sub.id));
        const items = Array.isArray(category.items) ? category.items.map((item) => normalizeItem(item, subcategoryIds)).filter(Boolean) : [];

        return {
          id: isNonEmptyString(category.id) ? category.id : createId("cat"),
          title,
          collapsed: Boolean(category.collapsed),
          role,
          subcategories,
          items
        };
      }

      function normalizeSubcategories(subcategories) {
        if (!Array.isArray(subcategories)) {
          return [];
        }

        const seen = new Set();
        return subcategories.map((subcat) => {
          if (typeof subcat === "string") {
            const title = subcat.trim();
            if (!title) {
              return null;
            }
            return {
              id: createId("sub"),
              title
            };
          }

          if (!subcat || typeof subcat !== "object") {
            return null;
          }

          const title = String(subcat.title || "").trim();
          if (!title) {
            return null;
          }

          const id = isNonEmptyString(subcat.id) ? subcat.id : createId("sub");
          if (seen.has(id)) {
            return null;
          }
          seen.add(id);

          return {
            id,
            title
          };
        }).filter(Boolean);
      }

      function normalizeItem(item, subcategoryIds) {
        if (!item || typeof item !== "object") {
          return null;
        }

        const title = String(item.title || "").trim();
        if (!title) {
          return null;
        }

        const priority = ["red", "yellow", "green"].includes(item.priority) ? item.priority : "yellow";
        const due = normalizeDateValue(item.due);
        const tags = normalizeTagList(item.tags);
        const inspirationLinks = normalizeLinks(item.inspirationLinks);

        return {
          id: isNonEmptyString(item.id) ? item.id : createId("item"),
          title,
          priority,
          due,
          tags,
          inspirationLinks,
          outfits: {
            rotem: String(item.outfits && item.outfits.rotem || "").trim(),
            meir: String(item.outfits && item.outfits.meir || "").trim()
          },
          subcat: isNonEmptyString(item.subcat) && subcategoryIds.has(item.subcat) ? item.subcat : null
        };
      }

      function normalizeLinks(links) {
        const list = Array.isArray(links) ? links : [];
        return list.map(normalizeLink).filter(Boolean);
      }

      function normalizeLink(value) {
        let url = String(value || "").trim();
        if (!url) {
          return "";
        }

        if (!/^https?:\/\//i.test(url)) {
          url = "https://" + url;
        }

        try {
          const parsed = new URL(url);
          if (!/^https?:$/i.test(parsed.protocol)) {
            return "";
          }
          return parsed.href;
        } catch (error) {
          return "";
        }
      }

      function normalizeRole(role, title) {
        if (role === "ready" || role === "published") {
          return role;
        }

        const cleanTitle = String(title || "").trim();
        if (cleanTitle === READY_TITLE) {
          return "ready";
        }
        if (cleanTitle === PUBLISHED_TITLE) {
          return "published";
        }
        return "";
      }

      function normalizeDateValue(value) {
        const date = String(value || "").trim();
        return /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : "";
      }

      function isNonEmptyString(value) {
        return typeof value === "string" && value.trim().length > 0;
      }

      function splitList(value, separatorRegex) {
        if (Array.isArray(value)) {
          return uniqueStrings(value);
        }

        const text = String(value || "");
        return uniqueStrings(text.split(separatorRegex));
      }

      function normalizeTagName(value) {
        const clean = String(value || "").trim();
        if (!clean) {
          return "";
        }

        if (clean === "מתכונים") {
          return "מתכון";
        }

        return clean;
      }

      function normalizeTagList(values) {
        const source = Array.isArray(values) ? values : splitList(values, /[,\n]/g);
        const seen = new Set();
        const result = [];

        source.forEach((value) => {
          const clean = normalizeTagName(value);
          if (!clean || seen.has(clean)) {
            return;
          }
          seen.add(clean);
          result.push(clean);
        });

        return result;
      }

      function uniqueStrings(values) {
        const seen = new Set();
        const result = [];

        values.forEach((value) => {
          const clean = String(value || "").trim();
          if (!clean || seen.has(clean)) {
            return;
          }
          seen.add(clean);
          result.push(clean);
        });

        return result;
      }

      function commit(options = {}) {
        state.board = normalizeBoard(state.board);
        syncBoard();
        saveBoard();
        if (!options.saveOnly) {
          render();
        } else {
          render();
        }
      }

      function syncBoard() {
        const allScheduleUndatedIds = getScheduleSourceEntries()
          .filter((entry) => !entry.item.due)
          .map((entry) => entry.item.id);
        const validUndatedSet = new Set(allScheduleUndatedIds);
        state.board.scheduleManual = state.board.scheduleManual.filter((id) => validUndatedSet.has(id));
        state.board.calendarDates = normalizeCalendarDates(state.board.calendarDates);

        const tagColors = { ...state.board.tagColors };
        getAllTags().forEach((tag) => {
          if (!tagColors[tag]) {
            tagColors[tag] = colorFromString(tag);
          } else {
            tagColors[tag] = sanitizeColor(tagColors[tag], colorFromString(tag));
          }
        });
        state.board.tagColors = tagColors;

        state.board.categories.forEach((category) => {
          const subIds = new Set((category.subcategories || []).map((sub) => sub.id));
          category.items.forEach((item) => {
            if (item.subcat && !subIds.has(item.subcat)) {
              item.subcat = null;
            }
            item.priority = ["red", "yellow", "green"].includes(item.priority) ? item.priority : "yellow";
            item.due = normalizeDateValue(item.due);
            item.tags = normalizeTagList(item.tags || []);
            item.inspirationLinks = normalizeLinks(item.inspirationLinks || []);
            item.outfits = item.outfits || { rotem: "", meir: "" };
            item.outfits.rotem = String(item.outfits.rotem || "").trim();
            item.outfits.meir = String(item.outfits.meir || "").trim();
            item.title = String(item.title || "").trim() || "ללא כותרת";
          });
        });

        document.body.classList.toggle("compact", Boolean(state.board.ui && state.board.ui.compact));
      }

      function saveBoard() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.board));
        } catch (error) {
          alert("לא הצלחתי לשמור את הלוח ב־localStorage.");
        }
      }

      function render() {
        const stats = getStats();
        const allTags = getAllTags();
        const activeFilterCount = getActiveFilterCount();
        const hasActiveSearchOrFilters = isFiltersActive();
        const showFiltersPanel = state.filtersPanelOpen || state.filters.tag !== "all";
        const showSearchRow = state.searchOpen;
        const tasksPanelVisible = shouldShowTasksPanel();
        const collapseToggle = getCollapseToggleState();

        if (state.focusCategoryId && !findCategory(state.focusCategoryId)) {
          state.focusCategoryId = null;
        }

        const categoriesToRender = getRenderableCategories();
        const focusedCategory = state.focusCategoryId ? findCategory(state.focusCategoryId) : null;

        refs.app.innerHTML = `
          <div class="shell">
            <header class="topbar">
              <div class="title-row">
                <div class="title-block">
                  <h1>לוח ניהול סרטונים</h1>
                </div>

                <div class="header-actions">
                  <button class="btn primary" type="button" data-action="open-item-dialog">+ סרטון חדש</button>
                  <button class="icon-btn top-icon-btn" type="button" data-action="toggle-all-panels" aria-label="${escapeAttr(collapseToggle.labelText)}">${collapseToggle.symbol}</button>
                  <button class="icon-btn top-icon-btn" type="button" data-action="open-calendar" aria-label="פתיחת לוח שנה">📅</button>
                  <button class="icon-btn top-icon-btn ${showSearchRow || state.filters.search ? "active" : ""}" type="button" data-action="toggle-search" aria-expanded="${showSearchRow ? "true" : "false"}" aria-label="חיפוש">⌕</button>
                  <button class="icon-btn top-icon-btn settings-trigger" type="button" data-action="open-settings" aria-label="הגדרות">⚙️</button>
                </div>
              </div>

              ${(focusedCategory || state.openWorkOnly) ? `
                <div class="view-state-row">
                  ${focusedCategory ? `<span class="view-chip">פוקוס: ${escapeHtml(focusedCategory.title)}</span>` : ""}
                  ${state.openWorkOnly ? '<span class="view-chip">עבודה פתוחה בלבד</span>' : ""}
                  ${focusedCategory ? '<button class="btn ghost slim-btn" type="button" data-action="clear-focus">יציאה מפוקוס</button>' : ""}
                  ${state.openWorkOnly ? '<button class="btn ghost slim-btn" type="button" data-action="toggle-open-work">הצגי הכל</button>' : ""}
                </div>
              ` : ""}

              <div class="stats-strip">
                <div class="stat-card">
                  <strong>${stats.totalItems}</strong>
                  <span>סך כל הסרטונים</span>
                </div>
                <div class="stat-card">
                  <strong>${stats.readyItems}</strong>
                  <span>מוכנים לעלייה</span>
                </div>
                <div class="stat-card">
                  <strong>${stats.openItems}</strong>
                  <span>עדיין בעבודה</span>
                </div>
              </div>

              <div class="filters-row">
                <div class="filters-toolbar">
                  <button class="btn ghost filter-toggle ${showFiltersPanel ? "active" : ""}" type="button" data-action="toggle-filters-panel">סינון${activeFilterCount ? ` (${activeFilterCount})` : ""}</button>
                </div>

                ${showSearchRow ? `
                  <div class="search-row compact-search-row">
                    <input class="input search-input" id="searchInput" type="search" placeholder="חיפוש סרטון..." value="${escapeAttr(state.filters.search)}">
                    ${state.filters.search ? '<button class="btn ghost filter-clear" type="button" data-action="clear-search">ניקוי</button>' : ""}
                    <button class="btn ghost filter-clear" type="button" data-action="toggle-search">סגירה</button>
                  </div>
                ` : ""}

                ${showFiltersPanel ? `
                  <div class="filters-panel">
                    <div class="field small">
                      <span>תגית</span>
                      <select class="select" id="tagFilter">
                        <option value="all">כל התגיות</option>
                        ${allTags.map((tag) => `<option value="${escapeAttr(tag)}" ${state.filters.tag === tag ? "selected" : ""}>${escapeHtml(tag)}</option>`).join("")}
                      </select>
                    </div>
                  </div>
                ` : ""}
              </div>

              ${hasActiveSearchOrFilters ? renderActiveFilterChips() : ""}

              <div class="progress-row">
                <div class="progress-box" style="flex: 1 1 100%;">
                  <div class="progress-headline">
                    <div>
                      <h2>התקדמות עבודה</h2>
                      <div class="progress-caption">${stats.readyItems} מוכנים לעלייה · ${stats.remaining}% עבודה נותרה</div>
                    </div>
                    <strong class="progress-value">${stats.progress}%</strong>
                  </div>
                  <div class="progress-track stacked-progress" aria-label="התפלגות הסרטונים לפי שלבי העבודה">
                    ${renderWorkflowSegments(stats)}
                  </div>
                  <div class="progress-mini">${stats.breakdown}</div>
                  ${stats.insight ? `<div class="progress-note">${escapeHtml(stats.insight)}</div>` : ""}
                </div>
              </div>
            </header>

            <main class="workspace">
              <section class="board-panel">
                <div class="board-grid">
                  ${focusedCategory ? "" : renderScheduleCard()}
                  ${categoriesToRender.length ? categoriesToRender.map((category) => renderCategoryCard(category)).join("") : renderBoardEmptyState()}
                </div>
              </section>

              <aside class="sidebar">
                ${tasksPanelVisible ? `
                  <section class="panel">
                    ${renderTasksPanel()}
                  </section>
                ` : ""}

                <section class="panel">
                  ${renderTagsPanel(allTags)}
                </section>
              </aside>
            </main>

            <button class="fab" type="button" data-action="open-item-dialog" aria-label="הוספת סרטון">+</button>
            ${renderSnackbar()}
            ${renderFloatingMenu()}
          </div>
        `;

        if (refs.calendarDialog.open) {
          renderCalendarDialog();
        }
        if (refs.dayDialog.open && state.calendarDayDate) {
          renderCalendarDayDialog(state.calendarDayDate);
        }
        if (refs.settingsDialog.open) {
          renderSettingsDialog();
        }
      }

      function renderUpcomingMenuItems() {
        return getUpcomingRangeOptions().map((option) => `
          <button class="mini-btn settings-chip ${state.filters.upcomingRange === option.value ? "active" : ""}" type="button" data-action="set-upcoming-range" data-range="${escapeAttr(option.value)}">${escapeHtml(option.label)}</button>
        `).join("");
      }

      function getUpcomingRangeOptions() {
        return [
          { value: "all", label: "ללא סינון תאריכים" },
          { value: "7", label: "שבוע קרוב" },
          { value: "14", label: "שבועיים קרובים" },
          { value: "21", label: "שלושה שבועות" },
          { value: "30", label: "עד חודש" }
        ];
      }

      function renderCategoryManagerRows() {
        return state.board.categories.map((category) => `
          <div class="category-manager-row">
            <div class="category-manager-meta">
              <strong>${escapeHtml(category.title)}</strong>
              <span class="muted">${category.items.length} פריטים</span>
            </div>
            <div class="category-manager-actions">
              <button class="mini-btn" type="button" data-action="open-item-dialog" data-category-id="${escapeAttr(category.id)}">+ סרטון</button>
              <button class="mini-btn" type="button" data-action="add-subcategory" data-category-id="${escapeAttr(category.id)}">+ תת</button>
              <button class="mini-btn" type="button" data-action="${state.focusCategoryId === category.id ? "clear-focus" : "focus-category"}" data-category-id="${escapeAttr(category.id)}">${state.focusCategoryId === category.id ? "פוקוס פעיל" : "פוקוס"}</button>
              <button class="mini-btn" type="button" data-action="open-category-dialog" data-category-id="${escapeAttr(category.id)}">עריכה</button>
              <button class="mini-btn danger" type="button" data-action="delete-category" data-category-id="${escapeAttr(category.id)}">מחק</button>
            </div>
          </div>
        `).join("");
      }

      function renderSettingsDialog() {
        const allTags = getAllTags();
        const tasks = [...state.board.tasks].sort((a, b) => Number(a.done) - Number(b.done) || compareText(a.text, b.text));
        const openTasks = tasks.filter((task) => !task.done).length;
        const colors = [
          { className: "color-green", title: "ירוק", hint: "מוכן לעלייה" },
          { className: "color-orange", title: "כתום", hint: "תאריך קרוב, עדיין לא מוכן" },
          { className: "color-red", title: "אדום", hint: "דחוף מאוד או עוד יומיים ופחות" },
          { className: "color-yellow", title: "צהוב", hint: "צולם אבל עדיין לא ערוך" },
          { className: "color-purple", title: "סגול", hint: "עריכה / דיבוב / שלבי עבודה מתקדמים" },
          { className: "color-lavender", title: "לילך", hint: "מתלבטת / בהמתנה" }
        ];

        refs.settingsContent.innerHTML = `
          <div class="settings-shell">
            <div class="panel-head dialog-head compact-dialog-head">
              <div>
                <h2>הגדרות</h2>
                <small>כלי ניהול, סינון והסבר צבעים במקום אחד.</small>
              </div>
              <button type="button" class="icon-btn dialog-close-btn" data-action="close-dialog" data-dialog-id="settingsDialog" aria-label="סגירת ההגדרות">✕</button>
            </div>

            <div class="settings-sections">
              <section class="settings-group">
                <h3>קטגוריות</h3>
                <div class="settings-actions">
                  <button class="btn ghost slim-btn" type="button" data-action="open-category-dialog">+ קטגוריה</button>
                  <button class="btn ghost slim-btn" type="button" data-action="toggle-all-panels">${getCollapseToggleState().labelText}</button>
                </div>
                <div class="category-manager-list">
                  ${renderCategoryManagerRows()}
                </div>
              </section>

              <section class="settings-group">
                <h3>משימות</h3>
                <form class="inline-form" id="settingsTaskForm">
                  <input class="input" name="taskText" placeholder="משימה חדשה..." maxlength="140">
                  <button class="btn ghost slim-btn" type="submit">הוספה</button>
                </form>
                <small>${tasks.length ? `סה"כ ${tasks.length} · פתוחות ${openTasks}` : "אין משימות כרגע"}</small>
              </section>

              <section class="settings-group">
                <h3>תגיות</h3>
                <div class="tag-manager">
                  ${allTags.length ? allTags.map((tag) => `
                    <div class="tag-manager-row">
                      <div class="tag-wrap">
                        ${renderTagChip(tag, false)}
                      </div>
                      <div class="tag-actions">
                        <input type="color" value="${escapeAttr(hexColor(sanitizeColor(state.board.tagColors[tag], colorFromString(tag))))}" data-action="tag-color" data-tag="${escapeAttr(tag)}" aria-label="בחירת צבע לתגית ${escapeAttr(tag)}">
                        <button class="icon-btn" type="button" data-action="rename-tag" data-tag="${escapeAttr(tag)}" aria-label="שינוי שם לתגית ${escapeAttr(tag)}">שינוי שם</button>
                        <button class="icon-btn" type="button" data-action="reset-tag-color" data-tag="${escapeAttr(tag)}" aria-label="איפוס צבע תגית ${escapeAttr(tag)}">איפוס</button>
                      </div>
                    </div>
                  `).join("") : renderEmptyState("אין תגיות פעילות", "התגיות יופיעו כאן אחרי שתשתמשי בהן")}
                </div>
              </section>

              <section class="settings-group">
                <h3>פילטרים</h3>
                <div class="settings-actions wrap-actions">
                  ${renderUpcomingMenuItems()}
                  <button class="mini-btn settings-chip ${state.openWorkOnly ? "active" : ""}" type="button" data-action="toggle-open-work">${state.openWorkOnly ? "הצגי הכל" : "עבודה פתוחה בלבד"}</button>
                  ${isFiltersActive() ? '<button class="mini-btn settings-chip" type="button" data-action="clear-filters">ניקוי פילטרים</button>' : ""}
                </div>
                ${renderActiveFilterChips()}
              </section>

              <section class="settings-group">
                <h3>ייבוא / ייצוא</h3>
                <div class="settings-actions">
                  <button class="btn ghost slim-btn" type="button" data-action="import-json">ייבוא JSON</button>
                  <button class="btn ghost slim-btn" type="button" data-action="export-json">ייצוא JSON</button>
                </div>
              </section>

              <section class="settings-group">
                <h3>הסבר צבעים</h3>
                <div class="color-explainer">
                  ${colors.map((entry) => `
                    <div class="color-row">
                      <span class="color-dot ${entry.className}" aria-hidden="true"></span>
                      <strong>${escapeHtml(entry.title)}</strong>
                      <span class="muted">${escapeHtml(entry.hint)}</span>
                    </div>
                  `).join("")}
                  <div class="color-row">
                    <span class="color-dot color-tag" aria-hidden="true"></span>
                    <strong>צבעי תגיות</strong>
                    <span class="muted">סיווגים כמו מצחיק, מתכון, זוגי ודייטים א-ב.</span>
                  </div>
                </div>
              </section>

              <section class="settings-group">
                <h3>תצוגה</h3>
                <div class="settings-actions">
                  <button class="btn ghost slim-btn" type="button" data-action="toggle-compact">${state.board.ui.compact ? "מצב רגיל" : "מצב קומפקטי"}</button>
                  <button class="btn ghost slim-btn" type="button" data-action="toggle-ui-panel" data-panel-key="tagsCollapsed" data-panel-id="tags">${state.board.ui.tagsCollapsed ? "פתיחת תגיות" : "הסתרת תגיות"}</button>
                </div>
              </section>
            </div>
          </div>
        `;

        if (!refs.settingsDialog.open) {
          refs.settingsDialog.showModal();
        }
      }

      function renderWorkflowSegments(stats) {
        const segments = [
          { label: "רעיונות", count: stats.stageCounts.ideas, className: "stage-ideas" },
          { label: "נקבע תאריך", count: stats.stageCounts.scheduled, className: "stage-scheduled" },
          { label: "צילמנו", count: stats.stageCounts.filmed, className: "stage-filmed" },
          { label: "צריך לדובב", count: stats.stageCounts.dubbing, className: "stage-dubbing" },
          { label: "עריכה", count: stats.stageCounts.editing, className: "stage-editing" },
          { label: "מתלבטת", count: stats.stageCounts.hold, className: "stage-hold" },
          { label: "מוכן", count: stats.stageCounts.ready, className: "stage-ready" },
          { label: "עלה", count: stats.stageCounts.published, className: "stage-published" }
        ].filter((segment) => segment.count > 0);

        if (!stats.totalItems) {
          return '<span class="progress-segment stage-empty" style="width:100%"></span>';
        }

        return segments.map((segment) => `
          <span class="progress-segment ${segment.className}" style="width:${(segment.count / stats.totalItems) * 100}%" title="${escapeAttr(`${segment.label}: ${segment.count}`)}" aria-label="${escapeAttr(`${segment.label}: ${segment.count}`)}"></span>
        `).join("");
      }

      function renderActiveFilterChips() {
        const chips = [];
        if (state.filters.search) {
          chips.push(renderFilterChip(`חיפוש: ${state.filters.search}`, "search"));
        }
        if (state.filters.tag !== "all") {
          chips.push(renderFilterChip(`תגית: ${state.filters.tag}`, "tag"));
        }
        if (state.filters.upcomingRange !== "all") {
          const selected = getUpcomingRangeOptions().find((option) => option.value === state.filters.upcomingRange);
          chips.push(renderFilterChip(`קרוב: ${selected ? selected.label : state.filters.upcomingRange}`, "upcoming"));
        }
        if (state.openWorkOnly) {
          chips.push(renderFilterChip("עבודה פתוחה בלבד", "openWork"));
        }

        if (!chips.length) {
          return "";
        }

        return `<div class="filter-chip-row">${chips.join("")}</div>`;
      }

      function renderFilterChip(label, key) {
        return `
          <button class="filter-chip" type="button" data-action="clear-filter-chip" data-filter-key="${escapeAttr(key)}" aria-label="הסרת סינון ${escapeAttr(label)}">
            <span>${escapeHtml(label)}</span>
            <span aria-hidden="true">×</span>
          </button>
        `;
      }

      function renderBoardEmptyState() {
        return `
          <section class="category-card board-empty-card">
            ${renderEmptyState("אין מה להציג כרגע", "נסי לבטל פוקוס או סינונים כדי לראות שוב את כל הלוח")}
          </section>
        `;
      }

      function renderSnackbar() {
        if (state.undoToast) {
          return `
            <div class="snackbar" role="status" aria-live="polite">
              <span>${escapeHtml(state.undoToast.message)}</span>
              <button class="btn ghost slim-btn" type="button" data-action="undo-delete">בטל</button>
            </div>
          `;
        }

        if (state.noticeToast) {
          return `
            <div class="snackbar notice" role="status" aria-live="polite">
              <span>${escapeHtml(state.noticeToast.message)}</span>
            </div>
          `;
        }

        return "";
      }

      function getRenderableCategories() {
        let categories = [...state.board.categories];

        if (state.focusCategoryId) {
          categories = categories.filter((category) => category.id === state.focusCategoryId);
        }

        if (state.openWorkOnly) {
          categories = categories.filter((category) => !isPublishedCategory(category));
        }

        return categories;
      }

      function renderScheduleCard() {
        const schedule = getScheduleBuckets();
        const combined = [...schedule.dated, ...schedule.undated];
        const collapsed = Boolean(state.board.ui && state.board.ui.scheduleCollapsed);

        return `
          <section class="category-card schedule-card panel-accordion ${collapsed ? "is-collapsed" : ""}" data-panel-id="schedule">
            <div class="schedule-head accordion-head" data-action="toggle-ui-panel" data-panel-key="scheduleCollapsed" data-panel-id="schedule" role="button" tabindex="0" aria-expanded="${collapsed ? "false" : "true"}">
              <div class="category-title compact-title">
                <h2>${escapeHtml(VIRTUAL_SCHEDULE_TITLE)}</h2>
                <span class="count-badge">${schedule.total}</span>
              </div>
              <span class="accordion-arrow" aria-hidden="true">▾</span>
            </div>

            <div class="accordion-shell ${collapsed ? "collapsed" : ""}">
              <div class="accordion-body">
                <div class="schedule-columns">
                  <div class="schedule-panel schedule-unified">
                    <div class="schedule-list" data-drop-type="schedule-list">
                      ${combined.length ? combined.map((entry) => renderScheduleItem(entry, !entry.item.due)).join("") : renderEmptyState("אין פריטים בסדר העלייה", "סרטונים עם עבודה פתוחה יופיעו כאן")}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderScheduleItem(entry, draggable) {
        const item = entry.item;
        const category = entry.category;
        const meta = renderDateMeta(item.due, category);
        const deadlineClass = getDeadlineToneClass(item, category);

        return `
          <article class="schedule-item ${deadlineClass} ${draggable ? "draggable" : ""}" data-action="open-item-dialog" data-item-id="${escapeAttr(item.id)}" data-source="schedule" role="button" tabindex="0" aria-label="פתיחת עריכת הסרטון ${escapeAttr(item.title)}" ${draggable ? 'draggable="true"' : ""} ${draggable ? `data-drag-type="schedule" data-item-id="${escapeAttr(item.id)}"` : ""} ${draggable ? `data-drop-type="schedule-item" data-item-id="${escapeAttr(item.id)}"` : ""}>
            <div class="row-main">
              <div class="row-title">
                <h4>${escapeHtml(item.title)}</h4>
              </div>
              <div class="row-meta">
                ${meta}
                <span class="source-pill">${escapeHtml(category.title)}</span>
                ${draggable ? '<span class="count-hint">ידני</span>' : ""}
              </div>
            </div>

            ${renderItemActions(item, { allowDelete: true, allowDetails: false, menuKey: `schedule:${item.id}`, allowEdit: true, categoryId: category.id, source: "schedule" })}
          </article>
        `;
      }

      function renderCategoryCard(category) {
        const visibleItems = category.items.filter((item) => matchesFilters(item, category));
        const filteredCount = visibleItems.length;
        const totalCount = category.items.length;
        const countLabel = isFiltersActive() && filteredCount !== totalCount ? `${filteredCount} / ${totalCount}` : `${totalCount}`;
        const roleClass = category.role === "ready" ? "ready-card" : category.role === "published" ? "published-card" : "";
        const toneClass = getCategoryToneClass(category);

        return `
          <section class="category-card ${roleClass} ${toneClass} ${category.collapsed ? "is-collapsed" : ""}" data-drop-type="category" data-category-id="${escapeAttr(category.id)}" data-item-drop="category">
            <div class="category-top" data-action="toggle-category" data-category-id="${escapeAttr(category.id)}" data-drag-type="category" draggable="true" role="button" tabindex="0" aria-expanded="${category.collapsed ? "false" : "true"}">
              <div class="category-toggle">
                <div class="category-title compact-title">
                  <h2>${escapeHtml(category.title)}</h2>
                  <span class="count-badge">${escapeHtml(countLabel)}</span>
                  ${renderRoleBadge(category)}
                </div>
                <span class="accordion-arrow" aria-hidden="true">▾</span>
              </div>
            </div>

            <div class="accordion-shell ${category.collapsed ? "collapsed" : ""}">
              <div class="accordion-body">
                ${renderCategoryBody(category, visibleItems)}
              </div>
            </div>
          </section>
        `;
      }

      function renderRoleBadge(category) {
        if (category.role === "ready") {
          return '<span class="role-badge ready">מוכן</span>';
        }
        if (category.role === "published") {
          return '<span class="role-badge published">פורסם</span>';
        }
        return "";
      }

      function renderCategoryBody(category, visibleItems) {
        if (!category.subcategories.length) {
          return `
            <div class="category-body">
              <div class="items-stack" data-drop-type="items" data-category-id="${escapeAttr(category.id)}" data-subcat-id="">
                ${visibleItems.length ? visibleItems.map((item) => renderBoardItem(item, category)).join("") : renderCategoryEmptyState(category.id)}
              </div>
            </div>
          `;
        }

        const groups = category.subcategories.map((subcat) => {
          const items = visibleItems.filter((item) => item.subcat === subcat.id);
          return `
            <div class="subcategory">
              <div class="subcat-head">
                <div class="category-title">
                  <h3>${escapeHtml(subcat.title)}</h3>
                  <span class="tiny-pill">${items.length}</span>
                </div>
                <div class="subcat-actions">
                  <button class="icon-btn" type="button" data-action="edit-subcategory" data-category-id="${escapeAttr(category.id)}" data-subcat-id="${escapeAttr(subcat.id)}">עריכה</button>
                  <button class="icon-btn danger" type="button" data-action="delete-subcategory" data-category-id="${escapeAttr(category.id)}" data-subcat-id="${escapeAttr(subcat.id)}">מחק</button>
                </div>
              </div>
              <div class="items-stack" data-drop-type="items" data-category-id="${escapeAttr(category.id)}" data-subcat-id="${escapeAttr(subcat.id)}">
                ${items.length ? items.map((item) => renderBoardItem(item, category)).join("") : renderCategoryEmptyState(category.id, "אין פריטים בתת־קטגוריה")}
              </div>
            </div>
          `;
        }).join("");

        const ungrouped = visibleItems.filter((item) => !item.subcat);

        return `
          <div class="category-body">
            ${groups}
            <div class="subcategory">
              <div class="subcat-head">
                <div class="category-title">
                  <h3>ללא תת־קטגוריה</h3>
                  <span class="tiny-pill">${ungrouped.length}</span>
                </div>
              </div>
              <div class="items-stack" data-drop-type="items" data-category-id="${escapeAttr(category.id)}" data-subcat-id="">
                ${ungrouped.length ? ungrouped.map((item) => renderBoardItem(item, category)).join("") : renderCategoryEmptyState(category.id, "אין פריטים ללא שיוך")}
              </div>
            </div>
          </div>
        `;
      }

      function renderBoardItem(item, category) {
        const meta = renderDateMeta(item.due, category);
        const deadlineClass = getDeadlineToneClass(item, category);

        return `
          <article class="item-card ${deadlineClass}" data-action="open-item-dialog" data-item-id="${escapeAttr(item.id)}" data-source="board" role="button" tabindex="0" aria-label="פתיחת עריכת הסרטון ${escapeAttr(item.title)}" draggable="true" data-drag-type="item" data-category-id="${escapeAttr(category.id)}" data-subcat-id="${escapeAttr(item.subcat || "")}" data-drop-type="item">
            <div class="row-main">
              <div class="row-title">
                <h4>${escapeHtml(item.title)}</h4>
              </div>
              <div class="row-meta">
                ${meta}
              </div>
            </div>
            ${renderItemActions(item, { allowDelete: true, allowDetails: false, menuKey: `board:${item.id}`, allowEdit: true, categoryId: category.id, source: "board" })}
          </article>
        `;
      }

      function renderDateMeta(due, category = null) {
        if (!due) {
          return '<span class="tiny-pill">ללא תאריך</span>';
        }
        const deadlineLabel = getDeadlineLabel(due, category);
        return `<span class="tiny-pill ${deadlineLabel.className}">${escapeHtml(formatDate(due))} · ${escapeHtml(getWeekday(due))}${deadlineLabel.text ? ` · ${escapeHtml(deadlineLabel.text)}` : ""}</span>`;
      }

      function getItemUrgencyState(item, category) {
        if (!item || !item.due || !category || isReadyCategory(category) || isPublishedCategory(category)) {
          return "";
        }

        const daysLeft = getDaysUntil(item.due);
        if (daysLeft <= 2) {
          return "urgent";
        }
        if (daysLeft <= 7) {
          return "soon";
        }
        return "";
      }

      function getDeadlineToneClass(item, category) {
        const urgency = getItemUrgencyState(item, category);
        if (urgency === "urgent") {
          return "deadline-urgent";
        }
        if (urgency === "soon") {
          return "deadline-soon";
        }
        return "";
      }

      function getDeadlineLabel(due, category) {
        const urgency = getItemUrgencyState({ due }, category);
        if (!urgency) {
          return { className: "", text: "" };
        }

        if (urgency === "urgent") {
          return { className: "deadline-urgent-pill", text: "דחוף" };
        }
        if (urgency === "soon") {
          return { className: "deadline-soon-pill", text: "קרוב" };
        }
        return { className: "", text: "" };
      }

      function getDaysUntil(value) {
        const target = parseDate(value);
        const today = parseDate(getTodayIso());
        if (!target || !today) {
          return Number.MAX_SAFE_INTEGER;
        }
        return Math.floor((target.getTime() - today.getTime()) / 86400000);
      }

      function renderItemHintPills(item) {
        const hints = [];
        if (item.tags && item.tags.length) {
          hints.push(`${item.tags.length} תגיות`);
        }
        if (item.outfits && (item.outfits.rotem || item.outfits.meir)) {
          hints.push("לוקים");
        }
        if (item.inspirationLinks && item.inspirationLinks.length) {
          hints.push(`${item.inspirationLinks.length} קישורים`);
        }

        return hints.map((hint) => `<span class="count-hint">${escapeHtml(hint)}</span>`).join("");
      }

      function renderItemActions(item, options = {}) {
        const allowDelete = options.allowDelete !== false;
        const allowDetails = options.allowDetails !== false;
        const allowEdit = options.allowEdit !== false;
        const categoryId = options.categoryId || "";
        const source = options.source || "board";
        const menuKey = String(options.menuKey || item.id);
        const menuOpen = state.openItemMenuKey === menuKey && state.floatingMenu && state.floatingMenu.key === menuKey;

        return `
          <div class="row-actions" data-action="noop">
            <div class="row-menu">
              <button class="mini-btn" type="button" data-action="toggle-item-menu" data-menu-type="item" data-menu-key="${escapeAttr(menuKey)}" data-item-id="${escapeAttr(item.id)}" data-category-id="${escapeAttr(categoryId)}" data-source="${escapeAttr(source)}" data-allow-edit="${allowEdit ? "1" : "0"}" data-allow-details="${allowDetails ? "1" : "0"}" data-allow-delete="${allowDelete ? "1" : "0"}" aria-expanded="${menuOpen ? "true" : "false"}" aria-label="פעולות נוספות עבור ${escapeAttr(item.title)}">⋯</button>
            </div>
          </div>
        `;
      }

      function renderFloatingMenu() {
        const menu = state.floatingMenu;
        if (!menu || menu.type !== "item") {
          return "";
        }

        const nextStage = menu.categoryId ? getNextStageCategory(menu.categoryId) : null;
        return `
          <button class="menu-sheet-backdrop" type="button" data-action="close-item-menu" aria-label="סגירת תפריט פעולות"></button>
          <div class="menu-sheet floating-item-menu" data-action="noop" role="dialog" aria-modal="true" aria-label="פעולות על פריט">
            <div class="menu-sheet-handle" aria-hidden="true"></div>
            <div class="menu-sheet-actions">
              ${menu.allowEdit ? `<button class="menu-sheet-btn" type="button" data-action="open-item-dialog" data-item-id="${escapeAttr(menu.itemId)}" data-source="${escapeAttr(menu.source)}">עריכה</button>` : ""}
              ${nextStage ? `<button class="menu-sheet-btn" type="button" data-action="move-to-next-stage" data-item-id="${escapeAttr(menu.itemId)}" data-category-id="${escapeAttr(menu.categoryId)}">העבר ל־${escapeHtml(nextStage.title)}</button>` : ""}
              ${menu.allowDelete ? `<button class="menu-sheet-btn danger" type="button" data-action="delete-item" data-item-id="${escapeAttr(menu.itemId)}">מחק</button>` : ""}
            </div>
          </div>
        `;
      }

      function renderCategoryEmptyState(categoryId, title = "אין פריטים בקטגוריה הזו") {
        return renderEmptyState(title, "", `<button class="btn ghost slim-btn empty-cta" type="button" data-action="open-item-dialog" data-category-id="${escapeAttr(categoryId)}">+ הוספת סרטון</button>`);
      }

      function renderEmptyState(title, hint, cta = "") {
        return `
          <div class="empty-box">
            <span class="empty-icon" aria-hidden="true">+</span>

      function renderTagWrap(tags, clickable = true) {
        if (!tags || !tags.length) {
          return "";
        }

        return `

            ${tags.map((tag) => renderTagChip(tag, clickable)).join("")}
          </div>

      function renderTagChip(tag, clickable) {
        const color = sanitizeColor(state.board.tagColors[tag], colorFromString(tag));
        const clickableAttrs = clickable ? ` role="button" tabindex="0" data-action="filter-tag" data-tag="${escapeAttr(tag)}"` : "";
        const clickableClass = clickable ? "clickable" : "";
        return `<span class="tag ${clickableClass}" style="--tag-color:${escapeAttr(color)}"${clickableAttrs}>#${escapeHtml(tag)}</span>`;
      }

      function renderOutfits(item) {
        const values = [];
        if (item.outfits && item.outfits.rotem) {
          values.push(`<span class="source-pill">רותם: ${escapeHtml(item.outfits.rotem)}</span>`);
        }
        if (item.outfits && item.outfits.meir) {
          values.push(`<span class="source-pill">מאיר: ${escapeHtml(item.outfits.meir)}</span>`);
        }
        if (!values.length) {
          return "";
        }
        return `<div class="outfit-row">${values.join("")}</div>`;
      }

      function renderLinks(links) {
        if (!links || !links.length) {
          return "";
        }

        return `
          <div class="links-row detail-links">
            ${links.map((link, index) => `<a class="link-chip" href="${escapeAttr(link)}" target="_blank" rel="noreferrer noopener">השראה ${index + 1}</a>`).join("")}
          </div>
        `;
      }

      function renderItemDetail(location) {
        const { category, item } = location;
        const subcategoryTitle = item.subcat ? getSubcategoryTitle(category, item.subcat) : "";
        const tags = renderTagWrap(item.tags, false) || '<p class="muted">אין תגיות לפריט הזה.</p>';
        const outfits = renderOutfits(item) || '<p class="muted">לא הוגדרו לוקים לפריט הזה.</p>';
        const links = renderLinks(item.inspirationLinks) || '<p class="muted">אין קישורי השראה לפריט הזה.</p>';

        return `
          <div class="panel-head">
            <div>
              <h2>${escapeHtml(item.title)}</h2>
              <small>כל הפרטים של הסרטון במקום אחד.</small>
            </div>
            <button type="button" class="btn ghost" data-action="close-dialog" data-dialog-id="detailDialog">סגירה</button>
          </div>

          <div class="detail-grid">
            <section class="detail-card">
              <h3>סקירה</h3>
              <div class="row-meta">
                ${renderDateMeta(item.due)}
                <span class="source-pill">${escapeHtml(category.title)}</span>
                ${subcategoryTitle ? `<span class="source-pill">${escapeHtml(subcategoryTitle)}</span>` : ""}
              </div>
            </section>

            <section class="detail-card">
              <h3>תגיות</h3>
              ${tags}
            </section>

            <section class="detail-card">
              <h3>לוקים</h3>
              ${outfits}
            </section>

            <section class="detail-card">
              <h3>קישורי השראה</h3>
              ${links}
            </section>
          </div>

          <div class="dialog-actions">
            <button type="button" class="btn primary" data-action="open-item-dialog" data-item-id="${escapeAttr(item.id)}">עריכת פריט</button>
            <button type="button" class="btn ghost" data-action="close-dialog" data-dialog-id="detailDialog">סגירה</button>
          </div>
        `;
      }

      function renderCalendarDialog() {
        const calendarView = state.board.ui && state.board.ui.calendarView === "year" ? "year" : "month";
        const isYearView = calendarView === "year";
        const currentMonthName = MONTH_NAMES[state.calendarMonth] || MONTH_NAMES[0];
        const topbarTitle = isYearView ? `לוח שנה ${state.calendarYear}` : `${currentMonthName} ${state.calendarYear}`;

        refs.calendarContent.innerHTML = `
          <div class="calendar-shell">
            <div class="calendar-topbar">
              <div>
                <h2>${escapeHtml(topbarTitle)}</h2>
                <p class="muted">סרטונים עם תאריך, ימי צילום ותאריכים חשובים באותה תצוגה.</p>
              </div>
              <div class="calendar-actions">
                <button class="btn ghost slim-btn" type="button" data-action="calendar-prev-month" aria-label="${isYearView ? "שנה קודמת" : "חודש קודם"}">${isYearView ? "‹ שנה" : "‹"}</button>
                <select class="select calendar-month-select" id="calendarMonthJump" aria-label="מעבר מהיר בין חודשים">
                  ${MONTH_NAMES.map((monthName, index) => `<option value="${index}" ${index === state.calendarMonth ? "selected" : ""}>${escapeHtml(monthName)}</option>`).join("")}
                </select>
                <button class="btn ghost slim-btn" type="button" data-action="calendar-next-month" aria-label="${isYearView ? "שנה הבאה" : "חודש הבא"}">${isYearView ? "שנה ›" : "›"}</button>
                <button class="btn ghost slim-btn" type="button" data-action="calendar-today">היום</button>
                <button class="btn ghost slim-btn" type="button" data-action="toggle-calendar-view">${isYearView ? "תצוגת חודש" : "תצוגת שנה"}</button>
                <button class="icon-btn dialog-close-btn" type="button" data-action="close-dialog" data-dialog-id="calendarDialog" aria-label="סגירת לוח השנה">✕</button>
              </div>
            </div>

            <div class="calendar-legend" role="list" aria-label="מקרא צבעים בלוח השנה">
              <span class="legend-pill status-ready" role="listitem">ירוק · מוכן לעלייה</span>
              <span class="legend-pill status-filmed" role="listitem">צהוב · צולם</span>
              <span class="legend-pill status-edit" role="listitem">סגול · בעריכה</span>
              <span class="legend-pill status-early" role="listitem">אדום · טרם צולם</span>
              <span class="legend-pill status-hold" role="listitem">לילך · מתלבטת</span>
              <span class="legend-pill holiday" role="listitem">חשוב · תאריך מיוחד</span>
              <span class="legend-pill filming-day" role="listitem">יום צילום</span>
            </div>

            <div class="calendar-grid ${isYearView ? "year-mode" : "month-mode"}">
              ${isYearView
                ? MONTH_NAMES.map((monthName, index) => renderCalendarMonth(state.calendarYear, index, monthName, { compact: true })).join("")
                : renderCalendarMonth(state.calendarYear, state.calendarMonth, currentMonthName, { compact: false })}
            </div>
          </div>
        `;
      }

      function renderCalendarMonth(year, monthIndex, monthName, options = {}) {
        const firstDay = new Date(year, monthIndex, 1);
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
        const leadingEmpty = firstDay.getDay();
        const compact = Boolean(options.compact);
        const cells = [];

        for (let i = 0; i < leadingEmpty; i += 1) {
          cells.push('<div class="calendar-cell empty"></div>');
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const iso = `${year}-${String(monthIndex + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          cells.push(renderCalendarDayCell(iso, day, compact));
        }

        return `
          <section class="calendar-month ${compact ? "compact" : ""}">
            <div class="calendar-month-head">${escapeHtml(monthName)}</div>
            <div class="calendar-weekdays">
              ${WEEKDAY_SHORT.map((day) => `<span>${escapeHtml(day)}</span>`).join("")}
            </div>
