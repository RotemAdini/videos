            <div class="calendar-days">
              ${cells.join("")}
            </div>
          </section>
        `;
      }

      function renderCalendarDayCell(isoDate, dayNumber, compact) {
        const entries = getCalendarEntriesForDate(isoDate);
        const importantDates = getCalendarImportantDatesForDate(isoDate);
        const isToday = isoDate === getTodayIso();
        const previewLimit = compact ? 2 : 3;
        const previewEntries = [...entries, ...importantDates].slice(0, previewLimit);
        const hiddenCount = Math.max(0, importantDates.length + entries.length - previewEntries.length);

        return `
          <button class="calendar-cell ${isToday ? "today" : ""}" type="button" data-action="open-calendar-day" data-date="${escapeAttr(isoDate)}" aria-label="פתיחת פרטי היום ${escapeAttr(formatDate(isoDate) || isoDate)}">
            <div class="calendar-date">${dayNumber}</div>
            <div class="calendar-events">
              ${previewEntries.map((entry) => renderCalendarPreviewPill(entry)).join("")}
              ${hiddenCount ? `<div class="calendar-more">+ ${hiddenCount} עוד</div>` : ""}
            </div>
          </button>
        `;
      }

      function getCalendarEntriesForDate(isoDate) {
        const entries = [];
        state.board.categories.forEach((category) => {
          category.items.forEach((item) => {
            if (item.due === isoDate && matchesFilters(item, category)) {
              entries.push({ category, item });
            }
          });
        });

        return entries.sort((a, b) => {
          const dateCompare = compareDates(a.item.due, b.item.due);
          if (dateCompare !== 0) {
            return dateCompare;
          }
          return compareText(a.item.title, b.item.title);
        });
      }

      function getCalendarImportantDatesForDate(isoDate) {
        const staticDates = HOLIDAYS.filter((entry) => entry.date === isoDate).map((entry) => ({
          type: "holiday",
          title: entry.title,
          date: entry.date
        }));
        const customDates = (state.board.calendarDates || []).filter((entry) => entry.date === isoDate).map((entry) => ({
          type: entry.type || "note",
          id: entry.id,
          title: entry.title,
          date: entry.date
        }));
        return [...staticDates, ...customDates];
      }

      function renderCalendarPreviewPill(entry) {
        if (entry.type === "holiday" || entry.type === "note" || entry.type === "filming-day") {
          const calendarType = getCalendarDateTypeMeta(entry.type);
          return `<div class="calendar-pill ${escapeAttr(calendarType.className)}">${escapeHtml(entry.title)}</div>`;
        }

        const status = getCalendarStatusInfo(entry.category);
        return `
          <div class="calendar-pill ${escapeAttr(status.className)}" aria-label="${escapeAttr(`${entry.item.title} · ${status.label}`)}" title="${escapeAttr(entry.item.title)}">
            <span>${escapeHtml(entry.item.title)}</span>
          </div>
        `;
      }

      function renderCalendarDayDialog(isoDate) {
        const entries = getCalendarEntriesForDate(isoDate);
        const importantDates = getCalendarImportantDatesForDate(isoDate);

        refs.dayContent.innerHTML = `
          <div class="day-shell">
            <button type="button" class="icon-btn dialog-close-btn dialog-corner-btn" data-action="close-dialog" data-dialog-id="dayDialog" aria-label="סגירת פרטי היום">✕</button>
            <div class="panel-head">
              <div>
                <h2>${escapeHtml(formatDate(isoDate))}</h2>
                <small>${escapeHtml(getWeekday(isoDate))}</small>
              </div>
            </div>

            ${importantDates.length ? `
              <section class="detail-card">
                <h3>תאריכים חשובים</h3>
                <div class="day-date-list">
                  ${importantDates.map((entry) => renderImportantDateRow(entry)).join("")}
                </div>
              </section>
            ` : ""}

            ${entries.length ? `
              <section class="detail-card">
                <h3>סרטונים ביום הזה</h3>
                <div class="day-video-list">
                  ${entries.map((entry) => renderCalendarDayItem(entry)).join("")}
                </div>
              </section>
            ` : ""}

            <section class="detail-card">
              <h3>הוספת אירוע ליום הזה</h3>
              <form class="inline-form day-form" id="calendarDateForm">
                <input type="hidden" name="date" value="${escapeAttr(isoDate)}">
                <input class="input" name="title" maxlength="120" placeholder="למשל: צילום מתכון פסטה">
                <select class="select" name="type" aria-label="סוג האירוע">
                  <option value="note">אירוע / הערה</option>
                  <option value="filming-day">סימון כיום צילום</option>
                </select>
                <button class="btn primary" type="submit">הוספה</button>
              </form>
            </section>
          </div>
        `;
      }

      function renderCalendarDayItem(entry) {
        const status = getCalendarStatusInfo(entry.category);
        const urgencyClass = getCalendarUrgencyClass(entry);
        return `
          <button class="day-video-item ${escapeAttr(status.className)} ${escapeAttr(urgencyClass)}" type="button" data-action="open-item-dialog" data-item-id="${escapeAttr(entry.item.id)}" data-source="calendar" aria-label="פתיחת עריכת ${escapeAttr(entry.item.title)}">
            <span class="day-video-title">${escapeHtml(entry.item.title)}</span>
          </button>
        `;
      }

      function renderImportantDateRow(entry) {
        const isCustom = entry.type !== "holiday" && !entry.derived;
        const calendarType = getCalendarDateTypeMeta(entry.type);
        const readonlyLabel = entry.type === "holiday" ? "חג מובנה" : entry.derived ? "נגזר מהסרטונים" : "";
        return `
          <div class="important-date-row">
            <div class="important-date-meta">
              <span class="calendar-pill ${escapeAttr(calendarType.className)}">${escapeHtml(entry.title)}</span>
              <span class="tiny-pill">${escapeHtml(calendarType.label)}</span>
            </div>
            ${isCustom ? `
              <div class="task-actions">
                <button class="icon-btn" type="button" data-action="edit-calendar-date" data-date-id="${escapeAttr(entry.id)}" aria-label="עריכת תאריך חשוב ${escapeAttr(entry.title)}">עריכה</button>
                <button class="icon-btn danger" type="button" data-action="delete-calendar-date" data-date-id="${escapeAttr(entry.id)}" aria-label="מחיקת תאריך חשוב ${escapeAttr(entry.title)}">מחק</button>
              </div>
            ` : `<span class="tiny-pill">${escapeHtml(readonlyLabel)}</span>`}
          </div>
        `;
      }

      function getCalendarDateTypeMeta(type) {
        if (type === "filming-day") {
          return { className: "filming-day", label: "יום צילום" };
        }
        if (type === "holiday") {
          return { className: "holiday", label: "חג" };
        }
        return { className: "note", label: "הערה" };
      }

      function getCalendarStatusInfo(category) {
        if (isPublishedCategory(category)) {
          return { className: "status-published", label: "פורסם", shortLabel: "פורסם" };
        }
        if (isReadyCategory(category)) {
          return { className: "status-ready", label: "מוכן לעלייה", shortLabel: "מוכן" };
        }
        if (category.title === HOLD_TITLE) {
          return { className: "status-hold", label: "מתלבטת", shortLabel: "מתלבטת" };
        }
        if (category.title === "צילמנו") {
          return { className: "status-filmed", label: "צולם", shortLabel: "צולם" };
        }
        if (category.title === DUBBING_TITLE || category.title === "עריכה בסיסית") {
          return { className: "status-edit", label: "בעריכה", shortLabel: "עריכה" };
        }
        return { className: "status-early", label: "טרם צולם", shortLabel: "לפני" };
      }

      function getCalendarStatusInfo(category) {
        if (isPublishedCategory(category)) {
          return { className: "status-published", label: "פורסם", shortLabel: "פורסם" };
        }
        if (isReadyCategory(category)) {
          return { className: "status-ready", label: "מוכן לעלייה", shortLabel: "מוכן" };
        }
        if (category.title === HOLD_TITLE) {
          return { className: "status-hold", label: "מתלבטת", shortLabel: "מתלבטת" };
        }
        if (category.title === "נקבע תאריך") {
          return { className: "status-scheduled", label: "נקבע תאריך", shortLabel: "תאריך" };
        }
        if (category.title === "צילמנו") {
          return { className: "status-filmed", label: "צולם", shortLabel: "צולם" };
        }
        if (category.title === DUBBING_TITLE || category.title === "עריכה בסיסית") {
          return { className: "status-edit", label: "בעריכה", shortLabel: "עריכה" };
        }
        return { className: "status-early", label: "טרם צולם", shortLabel: "מוקדם" };
      }

      function renderCalendarDialog() {
        const calendarView = getCalendarView();
        syncCalendarFromFocusDate();
        const headerTitle = getCalendarHeaderTitle(calendarView);
        const headerHint = calendarView === "week"
          ? "תכנון שבועי נוח לנייד עם תאים גדולים יותר"
          : calendarView === "year"
            ? "מבט שנתי מהיר על כל החודשים"
            : "תכנון חודשי עם עומס יומי, דחופים וימי צילום";

        refs.calendarContent.innerHTML = `
          <div class="calendar-shell" data-calendar-shell="true">
            <div class="calendar-topbar">
              <div class="calendar-nav-row">
                <div class="calendar-nav">
                  <button class="calendar-nav-btn" type="button" data-action="calendar-prev-month" aria-label="${escapeAttr(getCalendarPrevLabel(calendarView))}">›</button>
                  <div class="calendar-nav-title">
                    <h2>${escapeHtml(headerTitle)}</h2>
                    <small>${escapeHtml(headerHint)}</small>
                  </div>
                  <button class="calendar-nav-btn" type="button" data-action="calendar-next-month" aria-label="${escapeAttr(getCalendarNextLabel(calendarView))}">‹</button>
                </div>

                <div class="calendar-top-actions">
                  <button class="btn ghost slim-btn calendar-today-btn" type="button" data-action="calendar-today" aria-label="חזרה להיום" title="חזרה להיום">היום</button>
                  <button class="icon-btn dialog-close-btn" type="button" data-action="close-dialog" data-dialog-id="calendarDialog" aria-label="סגירת לוח השנה">✕</button>
                </div>
              </div>

              <div class="calendar-toolbar">
                <div class="calendar-view-switch" role="tablist" aria-label="תצוגת לוח שנה">
                  ${["month", "week", "year"].map((view) => `
                    <button class="calendar-chip ${calendarView === view ? "active" : ""}" type="button" role="tab" aria-selected="${calendarView === view ? "true" : "false"}" data-action="set-calendar-view" data-view="${escapeAttr(view)}">${escapeHtml(getCalendarViewLabel(view))}</button>
                  `).join("")}
                </div>

                <div class="calendar-filter-bar" role="list" aria-label="סינון בלוח השנה">
                  ${CALENDAR_FILTER_OPTIONS.map((option) => `
                    <button class="calendar-chip ${state.calendarFilter === option.value ? "active" : ""}" type="button" role="listitem" data-action="set-calendar-filter" data-filter="${escapeAttr(option.value)}">${escapeHtml(option.label)}</button>
                  `).join("")}
                </div>
              </div>
            </div>

            <div class="calendar-legend" role="list" aria-label="מקרא צבעים בלוח השנה">
              <span class="legend-pill status-early" role="listitem">ורוד · התחלה / לא צולם</span>
              <span class="legend-pill status-scheduled" role="listitem">כתום · נקבע תאריך</span>
              <span class="legend-pill status-filmed" role="listitem">צהוב · צולם</span>
              <span class="legend-pill status-edit" role="listitem">סגול · דיבוב / עריכה</span>
              <span class="legend-pill status-ready" role="listitem">ירוק · מוכן לעלייה</span>
              <span class="legend-pill status-published" role="listitem">אפור · עלה</span>
              <span class="legend-pill status-hold" role="listitem">לילך · מתלבטת</span>
              <span class="legend-pill holiday" role="listitem">חשוב / חג</span>
              <span class="legend-pill filming-day" role="listitem">יום צילום</span>
            </div>

            <div class="calendar-grid ${escapeAttr(`${calendarView}-mode`)}">
              ${calendarView === "year"
                ? getCalendarYearRangeMonths(state.calendarFocusDate).map((entry) => renderCalendarMonth(entry.year, entry.monthIndex, entry.monthName, { compact: true })).join("")
                : calendarView === "week"
                  ? renderCalendarWeek(state.calendarFocusDate)
                  : renderCalendarMonth(state.calendarYear, state.calendarMonth, MONTH_NAMES[state.calendarMonth] || MONTH_NAMES[0], { compact: false })}
            </div>
          </div>
        `;
      }

      function getCalendarView() {
        return state.board.ui && ["month", "week", "year"].includes(state.board.ui.calendarView) ? state.board.ui.calendarView : "month";
      }

      function getCalendarViewLabel(view) {
        if (view === "week") {
          return "שבוע";
        }
        if (view === "year") {
          return "שנה";
        }
        return "חודש";
      }

      function getCalendarHeaderTitle(view) {
        if (view === "year") {
          const months = getCalendarYearRangeMonths(state.calendarFocusDate);
          const first = months[0];
          const last = months[months.length - 1];
          return `${first.monthName} ${first.year} — ${last.monthName} ${last.year}`;
        }
        if (view === "week") {
          const start = getWeekStartIso(state.calendarFocusDate || getTodayIso());
          return `${formatDate(start)} — ${formatDate(addDaysIso(start, 6))}`;
        }
        return `${MONTH_NAMES[state.calendarMonth] || MONTH_NAMES[0]} ${state.calendarYear}`;
      }

      function getCalendarPrevLabel(view) {
        if (view === "year") {
          return "שנה קודמת";
        }
        if (view === "week") {
          return "שבוע קודם";
        }
        return "חודש קודם";
      }

      function getCalendarNextLabel(view) {
        if (view === "year") {
          return "טווח חודשים הבא";
        }
        if (view === "week") {
          return "שבוע הבא";
        }
        return "חודש הבא";
      }

      function getCalendarYearRangeMonths(anchorIsoDate) {
        const anchor = normalizeDateValue(anchorIsoDate) || getTodayIso();
        const start = addMonthsIso(anchor, -1);
        const months = [];

        for (let index = 0; index < 13; index += 1) {
          const current = parseDate(addMonthsIso(start, index));
          months.push({
            year: current.getFullYear(),
            monthIndex: current.getMonth(),
            monthName: MONTH_NAMES[current.getMonth()] || ""
          });
        }

        return months;
      }

      function renderCalendarMonth(year, monthIndex, monthName, options = {}) {
        const firstDay = new Date(year, monthIndex, 1);
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
        const leadingEmpty = firstDay.getDay();
        const compact = Boolean(options.compact);
        const cells = [];

        for (let i = 0; i < leadingEmpty; i += 1) {
          cells.push('<div class="calendar-cell empty" aria-hidden="true"></div>');
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const iso = `${year}-${String(monthIndex + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          cells.push(renderCalendarDayCell(iso, day, { compact }));
        }

        return `
          <section class="calendar-month ${compact ? "compact" : ""}">
            ${compact ? `<div class="calendar-month-head">${escapeHtml(monthName)}</div>` : ""}
            <div class="calendar-weekdays">
              ${WEEKDAY_SHORT.map((day) => `<span>${escapeHtml(day)}</span>`).join("")}
            </div>
            <div class="calendar-days">
              ${cells.join("")}
            </div>
          </section>
        `;
      }

      function renderCalendarWeek(anchorIsoDate) {
        const weekStart = getWeekStartIso(anchorIsoDate || getTodayIso());
        const cells = [];

        for (let index = 0; index < 7; index += 1) {
          const iso = addDaysIso(weekStart, index);
          const date = parseDate(iso);
          cells.push(renderCalendarDayCell(iso, date ? date.getDate() : index + 1, { week: true }));
        }

        return `
          <section class="calendar-week-board">
            <div class="calendar-week-list">
              ${cells.join("")}
            </div>
          </section>
        `;
      }

      function renderCalendarDayCell(isoDate, dayNumber, options = {}) {
        const compact = Boolean(options.compact);
        const week = Boolean(options.week);
        const rawEntries = getCalendarRawVideoEntriesForDate(isoDate);
        const entries = filterCalendarVideoEntries(rawEntries);
        const importantDates = getCalendarImportantDatesForDate(isoDate);
        const isToday = isoDate === getTodayIso();
        const previewLimit = week ? 4 : compact ? 2 : 3;
        const previewEntries = [...importantDates, ...entries].slice(0, previewLimit);
        const hiddenCount = Math.max(0, importantDates.length + entries.length - previewEntries.length);
        const meta = getCalendarDayMeta(rawEntries, importantDates);
        const classes = [
          isToday ? "today" : "",
          week ? "week-cell" : "",
          meta.urgentCount ? "calendar-day-urgent" : "",
          meta.busy ? "calendar-day-busy" : "",
          meta.hasFilmingDay ? "calendar-day-filming" : ""
        ].filter(Boolean).join(" ");

        return `
          <div class="calendar-cell ${classes}" role="button" tabindex="0" data-action="open-calendar-day" data-date="${escapeAttr(isoDate)}" data-drop-type="calendar-day" aria-label="פתיחת פרטי היום ${escapeAttr(formatDate(isoDate) || isoDate)}">
            <div class="calendar-cell-top">
              <div class="calendar-day-heading">
                ${week ? `<span class="calendar-weekday-label">${escapeHtml(getWeekdayShortLabel(isoDate))}</span>` : ""}
                <span class="calendar-date">${dayNumber}</span>
              </div>
              <div class="calendar-day-flags">
                ${meta.urgentCount ? `<span class="calendar-flag urgent">${meta.urgentCount} דחוף</span>` : ""}
                ${meta.busy ? '<span class="calendar-flag busy">עמוס</span>' : ""}
              </div>
            </div>

            <div class="calendar-events">
              ${previewEntries.map((entry) => renderCalendarPreviewPill(entry)).join("")}
              ${hiddenCount ? `<div class="calendar-more">+ ${hiddenCount} עוד</div>` : ""}
            </div>
          </div>
        `;
      }

      function getCalendarRawVideoEntriesForDate(isoDate) {
        const entries = [];
        state.board.categories.forEach((category) => {
          category.items.forEach((item) => {
            if (item.due === isoDate && matchesFilters(item, category)) {
              entries.push({ category, item });
            }
          });
        });

        return entries.sort((a, b) => compareText(a.item.title, b.item.title));
      }

      function filterCalendarVideoEntries(entries) {
        if (state.calendarFilter === "ready") {
          return entries.filter((entry) => isReadyCategory(entry.category));
        }
        if (state.calendarFilter === "urgent") {
          return entries.filter((entry) => isCalendarUrgentEntry(entry));
        }
        if (state.calendarFilter === "filming" || state.calendarFilter === "important") {
          return [];
        }
        return entries;
      }

      function getCalendarEntriesForDate(isoDate) {
        return filterCalendarVideoEntries(getCalendarRawVideoEntriesForDate(isoDate));
      }

      function getCalendarImportantDatesForDate(isoDate) {
        const staticDates = HOLIDAYS.filter((entry) => entry.date === isoDate).map((entry) => ({
          type: "holiday",
          title: entry.title,
          date: entry.date
        }));
        const customDates = (state.board.calendarDates || []).filter((entry) => entry.date === isoDate).map((entry) => ({
          type: entry.type || "note",
          id: entry.id,
          title: entry.title,
          date: entry.date
        }));
        const entries = [...staticDates, ...customDates];
        const hasDerivedFilmingDay = getCalendarRawVideoEntriesForDate(isoDate).some((entry) => isScheduledCategory(entry.category));

        if (hasDerivedFilmingDay && !entries.some((entry) => entry.type === "filming-day")) {
          entries.unshift({
            id: `derived-filming:${isoDate}`,
            derived: true,
            type: "filming-day",
            title: "יום צילום",
            date: isoDate
          });
        }

        if (state.calendarFilter === "filming") {
          return entries.filter((entry) => entry.type === "filming-day");
        }
        if (state.calendarFilter === "important") {
          return entries.filter((entry) => entry.type !== "filming-day");
        }
        if (state.calendarFilter === "ready" || state.calendarFilter === "urgent") {
          return [];
        }

        return entries;
      }

      function getCalendarDayMeta(rawEntries, importantDates) {
        return {
          videoCount: rawEntries.length,
          urgentCount: rawEntries.filter((entry) => isCalendarUrgentEntry(entry)).length,
          busy: rawEntries.length >= 4,
          hasFilmingDay: importantDates.some((entry) => entry.type === "filming-day")
        };
      }

      function renderCalendarPreviewPill(entry) {
        if (entry.type === "holiday" || entry.type === "note" || entry.type === "filming-day") {
          const calendarType = getCalendarDateTypeMeta(entry.type);
          return `
            <div class="calendar-pill ${escapeAttr(calendarType.className)}" title="${escapeAttr(entry.title)}">
              <span class="calendar-marker" aria-hidden="true"></span>
              <span class="calendar-pill-text">${escapeHtml(entry.title)}</span>
            </div>
          `;
        }

        const status = getCalendarStatusInfo(entry.category);
        const urgencyClass = getCalendarUrgencyClass(entry);
        return `
          <button class="calendar-pill calendar-video-pill ${escapeAttr(status.className)} ${escapeAttr(urgencyClass)}" type="button" data-action="open-item-dialog" data-item-id="${escapeAttr(entry.item.id)}" data-source="calendar" draggable="true" data-drag-type="calendar-video" aria-label="${escapeAttr(`${entry.item.title} · ${status.label}`)}" title="${escapeAttr(entry.item.title)}">
            <span class="calendar-pill-text">${escapeHtml(entry.item.title)}</span>
          </button>
        `;
      }

      function renderCalendarDayDialog(isoDate) {
        const entries = getCalendarEntriesForDate(isoDate);
        const importantDates = getCalendarImportantDatesForDate(isoDate);

        refs.dayContent.innerHTML = `
          <div class="day-shell">
            <button type="button" class="icon-btn dialog-close-btn dialog-corner-btn" data-action="close-dialog" data-dialog-id="dayDialog" aria-label="סגירת פרטי היום">✕</button>
            <div class="day-sheet-handle" aria-hidden="true"></div>

            <div class="panel-head day-sheet-head">
              <div>
                <h2>${escapeHtml(formatDate(isoDate))}</h2>
                <small>${escapeHtml(getWeekday(isoDate))}</small>
              </div>
            </div>

            <div class="day-sheet-toolbar">
              <button type="button" class="btn primary slim-btn" data-action="quick-add-calendar-item" data-date="${escapeAttr(isoDate)}">+ סרטון לתאריך הזה</button>
            </div>

            ${importantDates.length ? `
              <section class="detail-card">
                <h3>תאריכים חשובים</h3>
                <div class="day-date-list">
                  ${importantDates.map((entry) => renderImportantDateRow(entry)).join("")}
                </div>
              </section>
            ` : ""}

            <section class="detail-card">
              <h3>סרטונים ביום הזה</h3>
              <div class="day-video-list">
                ${entries.length ? entries.map((entry) => renderCalendarDayItem(entry)).join("") : renderEmptyState("אין סרטונים מתוזמנים ליום הזה", "", `<button class="btn ghost slim-btn empty-cta" type="button" data-action="quick-add-calendar-item" data-date="${escapeAttr(isoDate)}">+ הוספת סרטון</button>`)}
              </div>
            </section>

            <section class="detail-card">
              <h3>הוספת אירוע ליום הזה</h3>
              <form class="inline-form day-form" id="calendarDateForm">
                <input type="hidden" name="date" value="${escapeAttr(isoDate)}">
                <input class="input" name="title" maxlength="120" placeholder="למשל: צילום מתכון פסטה">
                <select class="select" name="type" aria-label="סוג האירוע">
                  <option value="note">אירוע / הערה</option>
                  <option value="filming-day">סימון כיום צילום</option>
                </select>
                <button class="btn primary" type="submit">הוספה</button>
              </form>
            </section>
          </div>
        `;
      }

      function isCalendarUrgentEntry(entry) {
        return getItemUrgencyState(entry && entry.item, entry && entry.category) !== "";
      }

      function getCalendarUrgencyClass(entry) {
        const urgency = getItemUrgencyState(entry && entry.item, entry && entry.category);
        if (urgency === "urgent") {
          return "calendar-deadline-urgent";
        }
        if (urgency === "soon") {
          return "calendar-deadline-soon";
        }
        return "";
      }

      function syncCalendarFromFocusDate() {
        const focusDate = parseDate(state.calendarFocusDate || getTodayIso());
        if (!focusDate) {
          return;
        }
        state.calendarYear = focusDate.getFullYear();
        state.calendarMonth = focusDate.getMonth();
      }

      function getWeekStartIso(value) {
        const date = parseDate(value) || parseDate(getTodayIso());
        date.setDate(date.getDate() - date.getDay());
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function addDaysIso(value, amount) {
        const date = parseDate(value) || parseDate(getTodayIso());
        date.setDate(date.getDate() + amount);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function addMonthsIso(value, amount) {
        const date = parseDate(value) || parseDate(getTodayIso());
        const currentDay = date.getDate();
        date.setDate(1);
        date.setMonth(date.getMonth() + amount);
        const maxDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        date.setDate(Math.min(currentDay, maxDay));
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function getWeekdayShortLabel(value) {
        const date = parseDate(value);
        return date ? WEEKDAY_SHORT[date.getDay()] : "";
      }

      function updateCalendarItemDate(itemId, nextDate) {
        const location = findItemLocation(itemId);
        const normalizedDate = normalizeDateValue(nextDate);
        if (!location || !normalizedDate) {
          return;
        }
        if (location.item.due === normalizedDate) {
          return;
        }
        location.item.due = normalizedDate;
        state.calendarFocusDate = normalizedDate;
        commit();
        showNoticeToast(`התאריך של "${location.item.title}" עודכן`);
      }

      function openCalendarQuickAdd(date) {
        const defaultCategory = state.board.categories.find((category) => category.title === "רעיונות") || state.board.categories[0] || null;
        openItemDialog(null, defaultCategory ? defaultCategory.id : null, "calendar", { prefillDue: date });
      }

      function renderTasksPanel() {
        const tasks = [...state.board.tasks].sort((a, b) => Number(a.done) - Number(b.done) || compareText(a.text, b.text));
        const doneCount = tasks.filter((task) => task.done).length;
        const openCount = tasks.length - doneCount;
        const visibleTasks = state.board.ui.hideCompletedTasks ? tasks.filter((task) => !task.done) : tasks;
        const collapsed = Boolean(state.board.ui && state.board.ui.tasksCollapsed);

        return `
          <section class="panel-accordion ${collapsed ? "is-collapsed" : ""}" data-panel-id="tasks">
            <div class="panel-head accordion-head" data-action="toggle-ui-panel" data-panel-key="tasksCollapsed" data-panel-id="tasks" role="button" tabindex="0" aria-expanded="${collapsed ? "false" : "true"}">
              <div>
                <h2>משימות</h2>
                <small>${tasks.length ? `סה"כ ${tasks.length} · פתוחות ${openCount} · הושלמו ${doneCount}` : "עדיין אין משימות"}</small>
              </div>
              <span class="accordion-arrow" aria-hidden="true">▾</span>
            </div>

            <div class="accordion-shell ${collapsed ? "collapsed" : ""}">
              <div class="accordion-body">
                <form class="inline-form" id="taskForm">
                  <input class="input" name="taskText" placeholder="משימה חדשה..." maxlength="140">
                  <button class="btn primary" type="submit">הוספה</button>
                </form>

                <label class="toggle-row">
                  <input type="checkbox" id="hideCompletedTasks" ${state.board.ui.hideCompletedTasks ? "checked" : ""}>
                  <span>הסתרת משימות שהושלמו</span>
                </label>

                <div class="task-list">
                  ${visibleTasks.length ? visibleTasks.map((task) => `
                    <div class="task-row ${task.done ? "done" : ""}">
                      <label class="checkline">
                        <input type="checkbox" data-action="toggle-task" data-task-id="${escapeAttr(task.id)}" ${task.done ? "checked" : ""}>
                        <span class="task-text">${escapeHtml(task.text)}</span>
                      </label>
                      ${renderTaskActions(task)}
                    </div>
                  `).join("") : renderEmptyState(tasks.length ? "כל המשימות הושלמו" : "אין משימות עדיין", tasks.length ? "כרגע לא מוצגות משימות פתוחות" : "הוסיפי משימה שוטפת ללוח")}
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderTaskActions(task) {
        const menuKey = `task:${task.id}`;
        const menuOpen = state.openItemMenuKey === menuKey;

        return `
          <div class="task-actions" data-action="noop">
            <div class="row-menu">
              <button class="mini-btn" type="button" data-action="toggle-item-menu" data-menu-key="${escapeAttr(menuKey)}" aria-expanded="${menuOpen ? "true" : "false"}" aria-label="פעולות נוספות עבור המשימה ${escapeAttr(task.text)}">⋯</button>
              ${menuOpen ? `
                <div class="menu-popover row-popover">
                  <button class="menu-item" type="button" data-action="edit-task" data-task-id="${escapeAttr(task.id)}">עריכה</button>
                  <button class="menu-item danger" type="button" data-action="delete-task" data-task-id="${escapeAttr(task.id)}">מחק</button>
                </div>
              ` : ""}
            </div>
          </div>
        `;
      }

      function renderTagsPanel(allTags) {
        const collapsed = Boolean(state.board.ui && state.board.ui.tagsCollapsed);
        return `
          <section class="panel-accordion ${collapsed ? "is-collapsed" : ""}" data-panel-id="tags">
            <div class="panel-head accordion-head" data-action="toggle-ui-panel" data-panel-key="tagsCollapsed" data-panel-id="tags" role="button" tabindex="0" aria-expanded="${collapsed ? "false" : "true"}">
              <div>
                <h2>תגיות וצבעים</h2>
                <small>${allTags.length ? `${allTags.length} תגיות פעילות` : "אין תגיות פעילות"}</small>
              </div>
              <span class="accordion-arrow" aria-hidden="true">▾</span>
            </div>

            <div class="accordion-shell ${collapsed ? "collapsed" : ""}">
              <div class="accordion-body">
                <div class="tag-manager">
                  ${allTags.length ? allTags.map((tag) => `
                    <div class="tag-manager-row">
                      <div class="tag-wrap">
                        ${renderTagChip(tag, false)}
                      </div>
                      <div class="tag-actions">
                        <input type="color" value="${escapeAttr(hexColor(sanitizeColor(state.board.tagColors[tag], colorFromString(tag))))}" data-action="tag-color" data-tag="${escapeAttr(tag)}" aria-label="בחירת צבע לתגית ${escapeAttr(tag)}">
                        <button class="icon-btn" type="button" data-action="rename-tag" data-tag="${escapeAttr(tag)}" aria-label="שינוי שם לתגית ${escapeAttr(tag)}">שינוי שם</button>
                        <button class="icon-btn" type="button" data-action="reset-tag-color" data-tag="${escapeAttr(tag)}" aria-label="איפוס צבע תגית ${escapeAttr(tag)}">איפוס</button>
                      </div>
                    </div>
                  `).join("") : renderEmptyState("אין תגיות פעילות", "התגיות יופיעו אחרי שתוסיפי אותן לפריטים")}
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function getStats() {
        const categories = state.board.categories;
        const totalItems = categories.reduce((sum, category) => sum + category.items.length, 0);
        const readyItems = categories.filter(isReadyCategory).reduce((sum, category) => sum + category.items.length, 0);
        const publishedItems = categories.filter(isPublishedCategory).reduce((sum, category) => sum + category.items.length, 0);
        const openItems = totalItems - publishedItems;
        const tasksTotal = state.board.tasks.length;
        const tasksDone = state.board.tasks.filter((task) => task.done).length;
        const workflowCategories = categories.filter((category) => category.title !== VIRTUAL_SCHEDULE_TITLE);
        const stageCounts = getWorkflowStageCounts(categories);
        let progressSum = 0;

        workflowCategories.forEach((category, index) => {
          const stageProgress = getWorkflowStageProgress(category, index, workflowCategories.length);
          progressSum += category.items.length * stageProgress;
        });

        const progress = totalItems ? Math.round((progressSum / totalItems) * 100) : 0;
        const remaining = totalItems ? Math.max(0, 100 - progress) : 0;

        return {
          totalItems,
          readyItems,
          publishedItems,
          openItems,
          tasksTotal,
          tasksDone,
          progress,
          remaining,
          stageCounts,
          breakdown: getWorkflowBreakdown(stageCounts),
          insight: getWorkflowInsight(stageCounts)
        };
      }

      function getWorkflowStageCounts(categories) {
        const counts = {
          ideas: 0,
          scheduled: 0,
          filmed: 0,
          dubbing: 0,
          editing: 0,
          hold: 0,
          ready: 0,
          published: 0
        };

        categories.forEach((category) => {
          const count = category.items.length;
          if (!count) {
            return;
          }

          if (category.title === "רעיונות") {
            counts.ideas += count;
          } else if (category.title === "נקבע תאריך") {
            counts.scheduled += count;
          } else if (category.title === "צילמנו") {
            counts.filmed += count;
          } else if (category.title === DUBBING_TITLE) {
            counts.dubbing += count;
          } else if (category.title === "עריכה בסיסית") {
            counts.editing += count;
          } else if (category.title === HOLD_TITLE) {
            counts.hold += count;
          } else if (isReadyCategory(category)) {
            counts.ready += count;
          } else if (isPublishedCategory(category)) {
            counts.published += count;
          } else {
            counts.editing += count;
          }
        });

        return counts;
      }

      function getWorkflowStageProgress(category, index, totalStages) {
        if (category.title === "רעיונות") {
          return 0.08;
        }
        if (category.title === "נקבע תאריך") {
          return 0.22;
        }
        if (category.title === "צילמנו") {
          return 0.45;
        }
        if (category.title === DUBBING_TITLE) {
          return 0.58;
        }
        if (category.title === "עריכה בסיסית") {
          return 0.7;
        }
        if (category.title === HOLD_TITLE) {
          return 0.16;
        }
        if (isReadyCategory(category)) {
          return 0.9;
        }
        if (isPublishedCategory(category)) {
          return 1;
        }

        const normalizedIndex = totalStages > 1 ? index / (totalStages - 1) : 0;
        return Math.max(0, Math.min(1, normalizedIndex));
      }

      function getWorkflowBreakdown(stageCounts) {
        const parts = [
          `רעיונות: ${stageCounts.ideas}`,
          `נקבע תאריך: ${stageCounts.scheduled}`,
          `צילמנו: ${stageCounts.filmed}`,
          `דיבוב: ${stageCounts.dubbing}`,
          `עריכה: ${stageCounts.editing}`,
          `מוכנים: ${stageCounts.ready}`
        ];

        if (stageCounts.hold) {
          parts.push(`מתלבטת: ${stageCounts.hold}`);
        }

        return parts.join(" · ");
      }

      function getWorkflowInsight(stageCounts) {
        const entries = [
          { key: "ideas", count: stageCounts.ideas, message: "רוב העבודה עדיין בשלב הרעיונות" },
          { key: "scheduled", count: stageCounts.scheduled, message: "רוב העבודה כרגע סביב תיאום ותאריכים" },
          { key: "filmed", count: stageCounts.filmed, message: "רוב העבודה עדיין בצילום" },
          { key: "dubbing", count: stageCounts.dubbing, message: "הרבה סרטונים מחכים עדיין לדיבוב" },
          { key: "editing", count: stageCounts.editing, message: "רוב הסרטונים כבר בשלב עריכה" },
          { key: "hold", count: stageCounts.hold, message: "יש לא מעט סרטונים במצב מתלבטת" },
          { key: "ready", count: stageCounts.ready, message: "הרבה סרטונים כבר כמעט מוכנים לעלייה" },
          { key: "published", count: stageCounts.published, message: "חלק גדול מהלוח כבר פורסם" }
        ].filter((entry) => entry.count > 0);

        if (!entries.length) {
          return "עדיין אין סרטונים בלוח";
        }

        entries.sort((a, b) => b.count - a.count);
        return entries[0].message;
      }

      function getAllTags() {
        const tags = new Set(Object.keys(state.board.tagColors || {}));
        state.board.categories.forEach((category) => {
          category.items.forEach((item) => {
            (item.tags || []).forEach((tag) => tags.add(tag));
          });
        });
        return [...tags].sort(compareText);
      }

      function getScheduleSourceEntries() {
        const entries = [];
        state.board.categories.forEach((category) => {
          if (category.title === VIRTUAL_SCHEDULE_TITLE || isPublishedCategory(category)) {
            return;
          }
          category.items.forEach((item) => {
            entries.push({ category, item });
          });
        });
        return entries;
      }

      function getScheduleBuckets() {
        const entries = getScheduleSourceEntries().filter((entry) => matchesFilters(entry.item, entry.category));
        const dated = entries
          .filter((entry) => Boolean(entry.item.due))
          .sort((a, b) => compareDates(a.item.due, b.item.due) || compareText(a.item.title, b.item.title));

        const manualOrder = getScheduleManualOrder();
        const manualIndex = new Map(manualOrder.map((id, index) => [id, index]));
        const undated = entries
          .filter((entry) => !entry.item.due)
          .sort((a, b) => {
            const aIndex = manualIndex.has(a.item.id) ? manualIndex.get(a.item.id) : Number.MAX_SAFE_INTEGER;
            const bIndex = manualIndex.has(b.item.id) ? manualIndex.get(b.item.id) : Number.MAX_SAFE_INTEGER;
            if (aIndex !== bIndex) {
              return aIndex - bIndex;
            }
            return compareText(a.item.title, b.item.title);
          });

        return {
          dated,
          undated,
          total: dated.length + undated.length
        };
      }

      function getScheduleManualOrder() {
        const undatedEntries = getScheduleSourceEntries().filter((entry) => !entry.item.due);
        const existingIds = undatedEntries.map((entry) => entry.item.id);
        const manual = state.board.scheduleManual.filter((id) => existingIds.includes(id));
        const missing = undatedEntries
          .filter((entry) => !manual.includes(entry.item.id))
          .sort((a, b) => compareText(a.item.title, b.item.title))
          .map((entry) => entry.item.id);

        return [...manual, ...missing];
      }

      function matchesFilters(item, category = null) {
        const search = state.filters.search.trim().toLocaleLowerCase("he");
        const searchHaystack = getItemSearchHaystack(item);

        if (search && !searchHaystack.includes(search)) {
          return false;
        }

        if (state.filters.tag !== "all" && !(item.tags || []).includes(state.filters.tag)) {
          return false;
        }

        if (category && state.openWorkOnly && isPublishedCategory(category)) {
          return false;
        }

        if (!matchesUpcomingRange(item.due)) {
          return false;
        }

        return true;
      }

      function matchesUpcomingRange(due) {
        if (state.filters.upcomingRange === "all") {
          return true;
        }

        const dueDate = parseDate(due);
        if (!dueDate) {
          return false;
        }

        const days = Number(state.filters.upcomingRange || 0);
        if (!days) {
          return true;
        }

        const today = parseDate(getTodayIso());
        const diff = Math.floor((dueDate.getTime() - today.getTime()) / 86400000);
        return diff >= 0 && diff <= days;
      }

      function getItemSearchHaystack(item) {
        return [
          item.title,
          ...(item.tags || []),
          item.outfits && item.outfits.rotem,
          item.outfits && item.outfits.meir,
          ...(item.inspirationLinks || [])
        ].map((value) => String(value || "").toLocaleLowerCase("he")).join(" ");
      }

      function isFiltersActive() {
        return Boolean(
          state.filters.search
          || state.filters.tag !== "all"
          || state.filters.upcomingRange !== "all"
          || state.openWorkOnly
        );
      }

      function getActiveFilterCount() {
        let count = 0;
        if (state.filters.tag !== "all") {
          count += 1;
        }
        if (state.filters.upcomingRange !== "all") {
          count += 1;
        }
        if (state.openWorkOnly) {
          count += 1;
        }
        return count;
      }

      function handleClick(event) {
        const actionTarget = event.target.closest("[data-action]");
        if (!actionTarget) {
          if (state.openItemMenuKey || state.topMenuOpen) {
            closeUiMenus();
            render();
          }
          return;
        }

        const action = actionTarget.dataset.action;
        if (!action) {
          return;
        }

        const hadOpenMenus = Boolean(state.openItemMenuKey || state.topMenuOpen);

        if (action !== "toggle-item-menu" && action !== "toggle-top-menu") {
          closeUiMenus();
          if (hadOpenMenus) {
            render();
          }
        }

        switch (action) {
          case "noop":
            break;
          case "drag-category":
            break;
          case "open-settings":
            renderSettingsDialog();
            break;
          case "toggle-all-panels":
            toggleAllPanels();
            break;
          case "toggle-search":
            state.searchOpen = !state.searchOpen;
            if (!state.searchOpen && !state.filters.search) {
              state.filtersPanelOpen = false;
            }
            render();
            if (state.searchOpen) {
              window.setTimeout(() => {
                const input = document.getElementById("searchInput");
                if (input) {
                  input.focus();
                }
              }, 30);
            }
            break;
          case "clear-search":
            state.filters.search = "";
            state.searchOpen = false;
            render();
            break;
          case "open-calendar":
            openCalendarDialog();
            break;
          case "close-item-menu":
            closeUiMenus();
            render();
            break;
          case "open-calendar-day":
            openCalendarDayDialog(actionTarget.dataset.date || "");
            break;
          case "open-calendar-item":
            openItemDialog(actionTarget.dataset.itemId || null, null, "calendar");
            break;
          case "calendar-prev-month":
            shiftCalendarPeriod(-1);
            break;
          case "calendar-next-month":
            shiftCalendarPeriod(1);
            break;
          case "calendar-today":
            jumpCalendarToToday();
            break;
          case "set-calendar-view":
            state.board.ui.calendarView = ["month", "week", "year"].includes(actionTarget.dataset.view) ? actionTarget.dataset.view : "month";
            saveBoard();
            renderCalendarDialog();
            break;
          case "set-calendar-filter":
            state.calendarFilter = CALENDAR_FILTER_OPTIONS.some((option) => option.value === actionTarget.dataset.filter) ? actionTarget.dataset.filter : "all";
            renderCalendarDialog();
            break;
          case "toggle-calendar-view":
            state.board.ui.calendarView = getCalendarView() === "month" ? "week" : getCalendarView() === "week" ? "year" : "month";
            saveBoard();
            renderCalendarDialog();
            break;
          case "quick-add-calendar-item":
            openCalendarQuickAdd(actionTarget.dataset.date || state.calendarDayDate || state.calendarFocusDate || getTodayIso());
            break;
          case "open-item-dialog":
            openItemDialog(actionTarget.dataset.itemId || null, actionTarget.dataset.categoryId || null, actionTarget.dataset.source || "board");
            break;
          case "open-item-details":
            openItemDetails(actionTarget.dataset.itemId || null);
            break;
          case "toggle-item-menu":
            state.topMenuOpen = false;
            if (actionTarget.dataset.menuType === "item") {
              const menuKey = actionTarget.dataset.menuKey || "";
              if (state.openItemMenuKey === menuKey && state.floatingMenu && state.floatingMenu.key === menuKey) {
                state.openItemMenuKey = null;
                state.floatingMenu = null;
              } else {
                const rect = actionTarget.getBoundingClientRect();
                state.openItemMenuKey = menuKey;
                state.floatingMenu = {
                  type: "item",
                  key: menuKey,
                  itemId: actionTarget.dataset.itemId || "",
                  categoryId: actionTarget.dataset.categoryId || "",
                  source: actionTarget.dataset.source || "board",
                  allowEdit: actionTarget.dataset.allowEdit === "1",
                  allowDetails: actionTarget.dataset.allowDetails === "1",
                  allowDelete: actionTarget.dataset.allowDelete === "1",
                  rect: {
                    top: rect.top,
                    right: rect.right,
                    bottom: rect.bottom,
                    left: rect.left
                  }
                };
              }
            } else {
              state.floatingMenu = null;
              state.openItemMenuKey = state.openItemMenuKey === actionTarget.dataset.menuKey ? null : actionTarget.dataset.menuKey;
            }
            render();
            break;
          case "toggle-top-menu":
            state.openItemMenuKey = null;
            state.topMenuOpen = !state.topMenuOpen;
            render();
            break;
          case "toggle-filters-panel":
            state.filtersPanelOpen = !state.filtersPanelOpen;
            render();
            break;
          case "set-upcoming-range":
            state.filters.upcomingRange = actionTarget.dataset.range || "all";
            render();
            break;
          case "toggle-ui-panel":
            toggleStoredPanel(actionTarget.dataset.panelKey, actionTarget.dataset.panelId);
            break;
          case "open-category-dialog":
            openCategoryDialog(actionTarget.dataset.categoryId || null);
            break;
          case "focus-category":
            state.focusCategoryId = actionTarget.dataset.categoryId || null;
            render();
            break;
          case "clear-focus":
            state.focusCategoryId = null;
            render();
            break;
          case "toggle-open-work":
            state.openWorkOnly = !state.openWorkOnly;
            if (state.openWorkOnly && state.focusCategoryId) {
              const focused = findCategory(state.focusCategoryId);
              if (focused && isPublishedCategory(focused)) {
                state.focusCategoryId = null;
              }
            }
            render();
            break;
          case "clear-filter-chip":
            clearFilterChip(actionTarget.dataset.filterKey || "");
            break;
          case "close-dialog":
            closeDialog(actionTarget.dataset.dialogId, actionTarget.dataset.dialogId === "dayDialog" ? { returnToCalendar: true } : {});
            break;
          case "toggle-category":
            toggleCategory(actionTarget.dataset.categoryId);
            break;
          case "delete-category":
            deleteCategory(actionTarget.dataset.categoryId);
            break;
          case "add-subcategory":
            addSubcategory(actionTarget.dataset.categoryId);
            break;
          case "edit-subcategory":
            editSubcategory(actionTarget.dataset.categoryId, actionTarget.dataset.subcatId);
            break;
          case "delete-subcategory":
            deleteSubcategory(actionTarget.dataset.categoryId, actionTarget.dataset.subcatId);
            break;
          case "delete-item":
            deleteItem(actionTarget.dataset.itemId);
            break;
          case "delete-current-item":
            deleteCurrentItem();
            break;
          case "move-to-next-stage":
            moveItemToNextStage(actionTarget.dataset.itemId, actionTarget.dataset.categoryId || "");
            break;
          case "clear-filters":
            clearFilters();
            break;
          case "toggle-compact":
            toggleCompactMode();
            break;
          case "export-json":
            exportJson();
            break;
          case "import-json":
            refs.importInput.click();
            break;
          case "edit-task":
            editTask(actionTarget.dataset.taskId);
            break;
          case "delete-task":
            deleteTask(actionTarget.dataset.taskId);
            break;
          case "filter-tag":
            state.filters.tag = actionTarget.dataset.tag || "all";
            render();
            break;
          case "rename-tag":
            renameTagGlobally(actionTarget.dataset.tag);
            break;
          case "reset-tag-color":
            resetTagColor(actionTarget.dataset.tag);
            break;
          case "edit-calendar-date":
            editCalendarDate(actionTarget.dataset.dateId);
            break;
          case "delete-calendar-date":
            deleteCalendarDate(actionTarget.dataset.dateId);
            break;
          case "undo-delete":
            undoDelete();
            break;
          default:
            break;
        }
      }

      function handleKeydown(event) {
        if (event.key === "Escape" && (state.openItemMenuKey || state.topMenuOpen)) {
          closeUiMenus();
          render();
          return;
        }

        if (event.key !== "Enter" && event.key !== " ") {
          return;
        }

        const actionTarget = event.target.closest("[data-action]");
        if (!actionTarget) {
          return;
        }

        if (actionTarget.matches("button, input, select, textarea")) {
          return;
        }

        event.preventDefault();
        actionTarget.click();
      }

      function handleInput(event) {
        if (event.target.id === "searchInput") {
          const nextValue = event.target.value || "";
          state.filters.search = nextValue;
          render();
          const nextInput = document.getElementById("searchInput");
          if (nextInput) {
            nextInput.focus();
            nextInput.setSelectionRange(nextValue.length, nextValue.length);
          }
        }
      }

      function handleChange(event) {
        if (event.target.id === "tagFilter") {
          state.filters.tag = event.target.value || "all";
          render();
          return;
        }

        if (event.target.id === "calendarMonthJump") {
          state.calendarMonth = Number(event.target.value || 0);
          renderCalendarDialog();
          return;
        }

        if (event.target.id === "hideCompletedTasks") {
          state.board.ui.hideCompletedTasks = event.target.checked;
          commit();
          return;
        }

        if (event.target.name === "categoryId" && event.target.form === refs.itemForm) {
          populateSubcategoryOptions(event.target.value, refs.itemForm.elements.subcat.value);
          syncItemFormDueRequirement(event.target.value);
          return;
        }

        if (event.target.dataset.action === "toggle-task") {
          toggleTask(event.target.dataset.taskId, event.target.checked);
          return;
        }

        if (event.target.dataset.action === "tag-color") {
          setTagColor(event.target.dataset.tag, event.target.value);
        }
      }

      function handleSubmit(event) {
        if (event.target === refs.itemForm) {
          event.preventDefault();
          saveItemFromForm();
          return;
        }

        if (event.target === refs.categoryForm) {
          event.preventDefault();
          saveCategoryFromForm();
          return;
        }

        if (event.target.id === "taskForm" || event.target.id === "settingsTaskForm") {
          event.preventDefault();
          const formData = new FormData(event.target);
          const text = String(formData.get("taskText") || "").trim();
          if (!text) {
            return;
          }
          state.board.tasks.push({
            id: createId("task"),
            text,
            done: false
          });
          event.target.reset();
          commit();
          return;
        }

        if (event.target.id === "calendarDateForm") {
          event.preventDefault();
          saveCalendarDateFromForm(event.target);
        }
      }

      function handleDragStart(event) {
        const draggable = event.target.closest("[data-drag-type]");
        if (!draggable) {
          return;
        }

        clearDropHints();

        const dragType = draggable.dataset.dragType;
        if (dragType === "category") {
          state.drag = {
            type: "category",
            categoryId: draggable.dataset.categoryId
          };
        } else if (dragType === "item") {
          state.drag = {
            type: "item",
            itemId: draggable.dataset.itemId,
            fromCategoryId: draggable.dataset.categoryId
          };
        } else if (dragType === "schedule") {
          state.drag = {
            type: "schedule",
            itemId: draggable.dataset.itemId
          };
        } else if (dragType === "calendar-video") {
          state.drag = {
            type: "calendar-video",
            itemId: draggable.dataset.itemId
          };
        } else {
          return;
        }

        draggable.classList.add("dragging");
        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.dropEffect = "move";
          event.dataTransfer.setData("text/plain", JSON.stringify(state.drag));
        }
      }

      function handleDragOver(event) {
        if (!state.drag) {
          return;
        }

        if (state.drag.type === "category") {
          const categoryTarget = event.target.closest('[data-drop-type="category"]');
          if (categoryTarget && categoryTarget.dataset.categoryId !== state.drag.categoryId) {
            event.preventDefault();
            setDropHint(categoryTarget, "drop-highlight");
          }
          return;
        }

        if (state.drag.type === "item") {
          const itemTarget = event.target.closest('[data-drop-type="item"]');
          const stackTarget = event.target.closest('[data-drop-type="items"]');
          const categoryTarget = event.target.closest("[data-item-drop='category']");
          if (itemTarget || stackTarget || categoryTarget) {
            event.preventDefault();
            if (itemTarget) {
              setDropHint(itemTarget, "drop-before");
            } else if (stackTarget) {
              setDropHint(stackTarget, "drop-highlight");
            } else if (categoryTarget) {
              setDropHint(categoryTarget, "drop-highlight");
            }
          }
          return;
        }

        if (state.drag.type === "schedule") {
          const scheduleItem = event.target.closest('[data-drop-type="schedule-item"]');
          const scheduleList = event.target.closest('[data-drop-type="schedule-list"]');
          if (scheduleItem || scheduleList) {
            event.preventDefault();
            if (scheduleItem) {
              setDropHint(scheduleItem, "drop-before");
            } else {
              setDropHint(scheduleList, "drop-highlight");
            }
          }
          return;
        }

        if (state.drag.type === "calendar-video") {
          const dayTarget = event.target.closest('[data-drop-type="calendar-day"]');
          if (dayTarget) {
            event.preventDefault();
            setDropHint(dayTarget, "calendar-drop-target");
          }
        }
      }

      function handleDrop(event) {
        if (!state.drag) {
          return;
        }

        if (state.drag.type === "category") {
          const categoryTarget = event.target.closest('[data-drop-type="category"]');
          if (!categoryTarget || categoryTarget.dataset.categoryId === state.drag.categoryId) {
            return;
          }
          event.preventDefault();
          reorderCategories(state.drag.categoryId, categoryTarget.dataset.categoryId);
          clearDragState();
          commit();
          return;
        }

        if (state.drag.type === "item") {
          const itemTarget = event.target.closest('[data-drop-type="item"]');
          const stackTarget = event.target.closest('[data-drop-type="items"]');
          const categoryTarget = event.target.closest("[data-item-drop='category']");
          event.preventDefault();

          if (itemTarget) {
            moveBoardItem({
              itemId: state.drag.itemId,
              fromCategoryId: state.drag.fromCategoryId,
              toCategoryId: itemTarget.dataset.categoryId,
              beforeItemId: itemTarget.dataset.itemId,
              targetSubcat: itemTarget.dataset.subcatId || null
            });
            clearDragState();
            commit();
            return;
          }

          if (stackTarget) {
            moveBoardItem({
              itemId: state.drag.itemId,
              fromCategoryId: state.drag.fromCategoryId,
              toCategoryId: stackTarget.dataset.categoryId,
              beforeItemId: null,
              targetSubcat: stackTarget.dataset.subcatId || null
            });
            clearDragState();
            commit();
            return;
          }

          if (categoryTarget) {
            moveBoardItem({
              itemId: state.drag.itemId,
              fromCategoryId: state.drag.fromCategoryId,
              toCategoryId: categoryTarget.dataset.categoryId,
              beforeItemId: null,
              targetSubcat: null
            });
            clearDragState();
            commit();
          }
          return;
        }

        if (state.drag.type === "schedule") {
          const scheduleItem = event.target.closest('[data-drop-type="schedule-item"]');
          const scheduleList = event.target.closest('[data-drop-type="schedule-list"]');
          if (!scheduleItem && !scheduleList) {
            return;
          }
          event.preventDefault();
          reorderSchedule(state.drag.itemId, scheduleItem ? scheduleItem.dataset.itemId : null);
          clearDragState();
          commit();
          return;
        }

        if (state.drag.type === "calendar-video") {
          const dayTarget = event.target.closest('[data-drop-type="calendar-day"]');
          if (!dayTarget || !dayTarget.dataset.date) {
            return;
          }
          event.preventDefault();
          updateCalendarItemDate(state.drag.itemId, dayTarget.dataset.date);
          clearDragState();
        }
      }

      function handleTouchStart(event) {
        if (!refs.calendarDialog.open || refs.dayDialog.open) {
          state.touchGesture = null;
          return;
        }

        const shell = event.target.closest("[data-calendar-shell='true']");
        const interactive = event.target.closest("button, input, select, textarea, a");
        if (!shell || interactive || !event.changedTouches || !event.changedTouches[0]) {
          state.touchGesture = null;
          return;
        }

        state.touchGesture = {
          x: event.changedTouches[0].clientX,
          y: event.changedTouches[0].clientY
        };
      }

      function handleTouchEnd(event) {
        if (!state.touchGesture || !refs.calendarDialog.open || refs.dayDialog.open || !event.changedTouches || !event.changedTouches[0]) {
          state.touchGesture = null;
          return;
        }

        const deltaX = event.changedTouches[0].clientX - state.touchGesture.x;
        const deltaY = event.changedTouches[0].clientY - state.touchGesture.y;
        state.touchGesture = null;

        if (Math.abs(deltaX) < 48 || Math.abs(deltaX) < Math.abs(deltaY)) {
          return;
        }

        shiftCalendarPeriod(deltaX > 0 ? -1 : 1);
      }

      function clearDragState() {
        state.drag = null;
        clearDropHints();
        document.querySelectorAll(".dragging").forEach((node) => node.classList.remove("dragging"));
      }

      function setDropHint(node, className) {
        if (!node) {
          return;
        }

        if (state.dropHint && state.dropHint.node === node && state.dropHint.className === className) {
          return;
        }

        clearDropHints();
        node.classList.add(className);
        state.dropHint = { node, className };
      }

      function clearDropHints() {
        if (state.dropHint && state.dropHint.node) {
          state.dropHint.node.classList.remove(state.dropHint.className);
        }
        state.dropHint = null;
      }

      function openItemDialog(itemId, preferredCategoryId, source = "board", options = {}) {
        closeUiMenus();
        closeDialog("settingsDialog");
        state.dialogReturn = source === "calendar" ? {
          source,
          dayDate: state.calendarDayDate,
          calendarYear: state.calendarYear,
          calendarMonth: state.calendarMonth,
          calendarView: state.board.ui.calendarView,
          calendarFocusDate: state.calendarFocusDate,
          calendarFilter: state.calendarFilter
        } : null;
        closeDialog("detailDialog");
        closeDialog("dayDialog", { preserveState: Boolean(state.dialogReturn) });
        closeDialog("calendarDialog", { preserveState: Boolean(state.dialogReturn) });
        const form = refs.itemForm;
        form.reset();
        const itemLocation = itemId ? findItemLocation(itemId) : null;
        const categoryId = itemLocation ? itemLocation.category.id : preferredCategoryId || (state.board.categories[0] && state.board.categories[0].id) || "";
        state.editingItemId = itemLocation ? itemLocation.item.id : null;

        form.elements.itemId.value = state.editingItemId || "";
        document.getElementById("itemDialogTitle").textContent = state.editingItemId ? "עריכת פריט" : "פריט חדש";
        const deleteButton = document.getElementById("itemDeleteBtn");
        if (deleteButton) {
          deleteButton.hidden = !state.editingItemId;
        }
        populateCategoryOptions(categoryId);
        form.querySelectorAll('input[name="fixedTags"]').forEach((checkbox) => {
          checkbox.checked = false;
        });
        form.dataset.preservedTags = "[]";

        if (itemLocation) {
          form.elements.title.value = itemLocation.item.title;
          form.elements.categoryId.value = itemLocation.category.id;
          populateSubcategoryOptions(itemLocation.category.id, itemLocation.item.subcat || "");
          form.elements.subcat.value = itemLocation.item.subcat || "";
          form.elements.due.value = itemLocation.item.due || "";
          const itemTags = itemLocation.item.tags || [];
          form.querySelectorAll('input[name="fixedTags"]').forEach((checkbox) => {
            checkbox.checked = itemTags.includes(checkbox.value);
          });
          form.dataset.preservedTags = JSON.stringify(itemTags.filter((tag) => !FIXED_TAG_OPTIONS.includes(tag)));
          form.elements.outfitRotem.value = itemLocation.item.outfits.rotem || "";
          form.elements.outfitMeir.value = itemLocation.item.outfits.meir || "";
          form.elements.links.value = (itemLocation.item.inspirationLinks || []).join("\n");
        } else {
          populateSubcategoryOptions(categoryId, "");
          form.elements.due.value = normalizeDateValue(options.prefillDue);
        }

        syncItemFormDueRequirement(form.elements.categoryId.value);
        refs.itemDialog.showModal();
        window.setTimeout(() => form.elements.title.focus(), 30);
      }

      function populateCategoryOptions(selectedId) {
        const options = state.board.categories.map((category) => `<option value="${escapeAttr(category.id)}" ${selectedId === category.id ? "selected" : ""}>${escapeHtml(category.title)}</option>`).join("");
        refs.itemForm.elements.categoryId.innerHTML = options;
      }

      function populateSubcategoryOptions(categoryId, selectedId) {
        const category = findCategory(categoryId);
        const options = ['<option value="">ללא תת־קטגוריה</option>'];
        if (category) {
          category.subcategories.forEach((subcat) => {
            options.push(`<option value="${escapeAttr(subcat.id)}" ${selectedId === subcat.id ? "selected" : ""}>${escapeHtml(subcat.title)}</option>`);
          });
        }
        refs.itemForm.elements.subcat.innerHTML = options.join("");
      }

      function syncItemFormDueRequirement(categoryId) {
        const dueInput = refs.itemForm && refs.itemForm.elements && refs.itemForm.elements.due;
        if (!dueInput) {
          return;
        }

        const category = findCategory(categoryId);
        const required = Boolean(category && category.title === "נקבע תאריך");
        dueInput.required = required;
        dueInput.setAttribute("aria-required", required ? "true" : "false");
      }

      function getPreservedItemTags() {
        try {
          return normalizeTagList(JSON.parse(refs.itemForm.dataset.preservedTags || "[]"));
        } catch (error) {
          return [];
        }
      }

      function getAutoSubcategoryTag(category, subcatId) {
        if (!category || category.title !== "רעיונות" || !subcatId) {
          return "";
        }

        return normalizeTagName(getSubcategoryTitle(category, subcatId));
      }

      function saveItemFromForm() {
        const formData = new FormData(refs.itemForm);
        const title = String(formData.get("title") || "").trim();
        const categoryId = String(formData.get("categoryId") || "");
        const category = findCategory(categoryId);
        if (!title || !category) {
          alert("יש להזין כותרת ולבחור קטגוריה.");
          return;
        }

        const subcat = String(formData.get("subcat") || "");
        const selectedSubcat = category.subcategories.some((entry) => entry.id === subcat) ? subcat : null;
        const due = normalizeDateValue(formData.get("due"));
        if (category.title === "נקבע תאריך" && !due) {
          alert('בקטגוריה "נקבע תאריך" צריך לבחור תאריך.');
          const dueInput = refs.itemForm.elements.due;
          if (dueInput) {
            dueInput.focus();
          }
          return;
        }

        const subcategoryTags = category.title === "רעיונות"
          ? new Set((category.subcategories || []).map((entry) => normalizeTagName(entry.title)).filter(Boolean))
          : new Set();
        const preservedTags = getPreservedItemTags().filter((tag) => !subcategoryTags.has(tag));
        const autoSubcategoryTag = getAutoSubcategoryTag(category, selectedSubcat);
        const data = {
          title,
          priority: "yellow",
          due,
          tags: normalizeTagList([
            ...preservedTags,
            ...formData.getAll("fixedTags"),
            autoSubcategoryTag
          ]),
          inspirationLinks: String(formData.get("links") || "").split("\n").map(normalizeLink).filter(Boolean),
          outfits: {
            rotem: String(formData.get("outfitRotem") || "").trim(),
            meir: String(formData.get("outfitMeir") || "").trim()
          },
          subcat: selectedSubcat
        };

        if (state.editingItemId) {
          const location = findItemLocation(state.editingItemId);
          if (!location) {
            return;
          }

          data.priority = ["red", "yellow", "green"].includes(location.item.priority) ? location.item.priority : "yellow";
          Object.assign(location.item, data);
          if (location.category.id !== categoryId) {
            location.category.items = location.category.items.filter((item) => item.id !== location.item.id);
            category.items.push(location.item);
          }
        } else {
          category.items.push({
            id: createId("item"),
            ...data
          });
        }

        state.editingItemId = null;
        commit();
        closeDialog("itemDialog");
        showNoticeToast("הפריט נשמר");
      }

      function openCategoryDialog(categoryId) {
        closeUiMenus();
        closeDialog("settingsDialog");
        closeDialog("detailDialog");
        closeDialog("dayDialog");
        closeDialog("calendarDialog");
        const form = refs.categoryForm;
        form.reset();
        const category = categoryId ? findCategory(categoryId) : null;
        state.editingCategoryId = category ? category.id : null;
        document.getElementById("categoryDialogTitle").textContent = category ? "עריכת קטגוריה" : "קטגוריה חדשה";

        form.elements.categoryId.value = state.editingCategoryId || "";
        form.elements.title.value = category ? category.title : "";

      function saveCategoryFromForm() {
        const formData = new FormData(refs.categoryForm);
        const title = String(formData.get("title") || "").trim();
        if (!title) {
          alert("יש להזין שם לקטגוריה.");

      function closeDialog(dialogId, options = {}) {
        const dialog = document.getElementById(dialogId);
        const wasOpen = Boolean(dialog && dialog.open);
        if (dialog && dialog.open) {
          dialog.close();
        }
        if (dialogId === "dayDialog" && !options.preserveState) {
          const shouldReturnToCalendar = wasOpen && options.returnToCalendar && !refs.calendarDialog.open;
          state.calendarDayDate = "";
          if (shouldReturnToCalendar) {
            renderCalendarDialog();
            if (!refs.calendarDialog.open) {
              refs.calendarDialog.showModal();
            }
          }

        if (dialogId === "itemDialog") {

      function openCalendarDialog(options = {}) {
        const preserveState = Boolean(options.preserveState);
        closeDialog("settingsDialog");
        if (!preserveState) {
          jumpCalendarToToday({ skipRender: true });
          state.board.ui.calendarView = "month";
          state.calendarFilter = "all";

        closeDialog("dayDialog", { preserveState });
        state.calendarDayDate = "";
        renderCalendarDialog();

      function openCalendarDayDialog(isoDate) {
        if (!normalizeDateValue(isoDate)) {
          return;
        }
        closeDialog("calendarDialog", { preserveState: true });
        state.calendarDayDate = isoDate;
        state.calendarFocusDate = isoDate;
        syncCalendarFromFocusDate();
        renderCalendarDayDialog(isoDate);
        if (!refs.dayDialog.open) {
          refs.dayDialog.showModal();
        }
      }

      function shiftCalendarPeriod(direction) {
        const calendarView = getCalendarView();
        if (calendarView === "year") {
          state.calendarFocusDate = addMonthsIso(state.calendarFocusDate || getTodayIso(), direction);
          syncCalendarFromFocusDate();
        } else if (calendarView === "week") {
          state.calendarFocusDate = addDaysIso(state.calendarFocusDate || getTodayIso(), direction * 7);
          syncCalendarFromFocusDate();
        } else {
          state.calendarMonth += direction;
          if (state.calendarMonth < 0) {
            state.calendarMonth = 11;
            state.calendarYear -= 1;
          } else if (state.calendarMonth > 11) {
            state.calendarMonth = 0;
            state.calendarYear += 1;
          }
          const focusDate = parseDate(state.calendarFocusDate || getTodayIso()) || parseDate(getTodayIso());
          const nextDay = Math.min(focusDate.getDate(), new Date(state.calendarYear, state.calendarMonth + 1, 0).getDate());
          state.calendarFocusDate = `${state.calendarYear}-${String(state.calendarMonth + 1).padStart(2, "0")}-${String(nextDay).padStart(2, "0")}`;
        }
        renderCalendarDialog();
      }

      function jumpCalendarToToday(options = {}) {
        const todayIso = getTodayIso();
        const today = parseDate(todayIso);
        state.calendarYear = today.getFullYear();
        state.calendarMonth = today.getMonth();
        state.calendarFocusDate = todayIso;
        if (!options.skipRender) {
          renderCalendarDialog();
        }
      }

      function restoreDialogContext() {
        if (!state.dialogReturn) {
          return;
        }

        const context = { ...state.dialogReturn };
        state.dialogReturn = null;
        state.calendarYear = context.calendarYear;
        state.calendarMonth = context.calendarMonth;
        state.board.ui.calendarView = ["month", "week", "year"].includes(context.calendarView) ? context.calendarView : "month";
        state.calendarFocusDate = normalizeDateValue(context.calendarFocusDate) || state.calendarFocusDate || getTodayIso();
        state.calendarFilter = CALENDAR_FILTER_OPTIONS.some((option) => option.value === context.calendarFilter) ? context.calendarFilter : "all";

        if (context.dayDate) {
          state.calendarDayDate = context.dayDate;
          renderCalendarDayDialog(context.dayDate);
          if (!refs.dayDialog.open) {
            refs.dayDialog.showModal();
          }
          return;
        }

        renderCalendarDialog();
        if (!refs.calendarDialog.open) {
          refs.calendarDialog.showModal();
        }
      }

        const shell = root ? root.querySelector(".accordion-shell") : null;
        const body = shell ? shell.querySelector(".accordion-body") : null;

        state.board.ui[panelKey] = !state.board.ui[panelKey];
        saveBoard();

        if (!root || !shell || !body) {

          return;

        animateAccordionToggle(root, shell, body, state.board.ui[panelKey]);

      function clearFilters() {

      function shouldShowTasksPanel() {
        return state.board.tasks.some((task) => !task.done);

      function getCollapseToggleState() {
        const taskRelevant = shouldShowTasksPanel();
        const categoryCollapsed = state.board.categories.filter((category) => category.collapsed).length;
        const extraCollapsed = Number(Boolean(state.board.ui && state.board.ui.scheduleCollapsed)) + Number(taskRelevant && state.board.ui && state.board.ui.tasksCollapsed);
        const totalPanels = state.board.categories.length + 1 + Number(taskRelevant);
        const collapsedCount = categoryCollapsed + extraCollapsed;
        const mostlyClosed = totalPanels ? collapsedCount >= Math.ceil(totalPanels / 2) : false;
        return {
          mostlyClosed,
          symbol: mostlyClosed ? "+" : "-",
          labelText: mostlyClosed ? "פתיחת כל הקטגוריות" : "סגירת כל הקטגוריות"
        };

        const nextCollapsed = !getCollapseToggleState().mostlyClosed;
        state.board.categories.forEach((category) => {

        state.board.ui.scheduleCollapsed = nextCollapsed;
        state.board.ui.tasksCollapsed = nextCollapsed;
        commit();

        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `video-board-${new Date().toISOString().slice(0, 10)}.json`;
        anchor.click();
        URL.revokeObjectURL(url);

          state.board = normalizeBoard(parsed);
          commit();
