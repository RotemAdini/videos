<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח ניהול סרטונים</title>
  <style>
    :root {
      --bg: #f7f1e7;
      --bg-2: #fff9f2;
      --ink: #1c242c;
      --muted: #66717d;
      --line: rgba(22, 39, 56, 0.12);
      --card: rgba(255, 255, 255, 0.78);
      --card-strong: rgba(255, 255, 255, 0.9);
      --shadow: 0 20px 45px rgba(54, 42, 24, 0.12);
      --accent: #0f766e;
      --accent-strong: #0b5b55;
      --warm: #d97745;
      --warm-strong: #c25f2d;
      --red: #d4455f;
      --yellow: #d39f0e;
      --green: #199b68;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --space: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --chip: rgba(15, 118, 110, 0.08);
      --published: rgba(212, 69, 95, 0.12);
      --ready: rgba(25, 155, 104, 0.12);
      --idea: rgba(217, 119, 69, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Heebo", "Assistant", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.18), transparent 28%),
        radial-gradient(circle at top left, rgba(217, 119, 69, 0.2), transparent 30%),
        linear-gradient(180deg, #fff8ef 0%, #f7f0e4 52%, #efe6d7 100%);
    }

    body.compact {
      --space: 0.7rem;
      --space-lg: 1rem;
      --space-xl: 1.3rem;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      color: inherit;
      background: none;
    }

    a {
      color: inherit;
    }

    code {
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 0.95em;
    }

    .shell {
      width: min(1500px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 2rem;
    }

    .topbar {
      display: grid;
      gap: 0.55rem;
      padding: 0.72rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 244, 255, 0.94));
      box-shadow: none;
      backdrop-filter: blur(18px);
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin: 0;
    }

    .title-block h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .title-block .subtitle {
      margin-top: 0.5rem;
      color: var(--muted);
      max-width: 58rem;
    }

    .header-actions,
    .filters-row,
    .stats-strip,
    .progress-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 42px;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: 1px solid transparent;
      background: rgba(15, 118, 110, 0.08);
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      box-shadow: 0 12px 25px rgba(15, 118, 110, 0.24);
    }

    .btn.warm {
      background: linear-gradient(135deg, var(--warm), var(--warm-strong));
      color: white;
      box-shadow: 0 12px 25px rgba(201, 106, 61, 0.24);
    }

    .btn.ghost {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.58);
    }

    .btn.active {
      background: rgba(15, 118, 110, 0.15);
      border-color: rgba(15, 118, 110, 0.25);
    }

    .stat-card {
      min-width: 140px;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--card-strong);
      box-shadow: 0 10px 18px rgba(28, 36, 44, 0.06);
    }

    .stat-card strong {
      display: block;
      font-size: 1.35rem;
      margin-bottom: 0.2rem;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .filters-row {
      padding: 0.8rem;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--line);
    }

    .field {
      display: grid;
      gap: 0.35rem;
      min-width: 160px;
      flex: 1 1 160px;
    }

    .field.small {
      flex: 0 0 160px;
    }

    .field span,
    .filters-title,
    .panel-head small,
    .muted {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 46px;
      padding: 0.78rem 0.95rem;
      border: 1px solid rgba(28, 36, 44, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.55;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: rgba(15, 118, 110, 0.55);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }

    .progress-box {
      display: grid;
      gap: 0.45rem;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.08), rgba(217, 119, 69, 0.08));
    }

    .progress-track {
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(28, 36, 44, 0.08);
    }

    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--warm));
      transition: width 0.2s ease;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 1rem;
      align-items: start;
    }

    .board-panel,
    .sidebar .panel {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 250, 242, 0.82));
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .board-panel {
      padding: 1rem;
    }

    .board-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      align-items: start;
    }

    .category-card {
      --tone: rgba(124, 58, 237, 0.06);
      display: grid;
      gap: 0;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 244, 255, 0.94));
      box-shadow: none;
      transition: none;
    }

    .category-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(31, 42, 55, 0.1);
    }

    .category-card.ready-card {
      background: linear-gradient(180deg, rgba(25, 155, 104, 0.08), rgba(255, 255, 255, 0.82));
    }

    .category-card.published-card {
      background: linear-gradient(180deg, rgba(212, 69, 95, 0.09), rgba(255, 255, 255, 0.82));
    }

    .category-card.schedule-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.1), rgba(255, 255, 255, 0.9), rgba(217, 119, 69, 0.08));
      border-color: rgba(15, 118, 110, 0.18);
    }

    .category-top,
    .panel-head,
    .subcat-head,
    .item-head,
    .schedule-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .category-title-wrap {
      display: grid;
      gap: 0.35rem;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .count-badge,
    .role-badge,
    .tiny-pill,
    .priority-pill,
    .source-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      min-height: 28px;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .count-badge {
      background: rgba(28, 36, 44, 0.08);
      color: var(--muted);
    }

    .role-badge.ready {
      background: var(--ready);
      color: var(--green);
    }

    .role-badge.published {
      background: var(--published);
      color: var(--red);
    }

    .tiny-pill {
      background: rgba(15, 118, 110, 0.09);
      color: var(--accent);
      font-weight: 600;
    }

    .category-actions,
    .item-actions,
    .subcat-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .icon-btn {
      min-width: 34px;
      min-height: 34px;
      padding: 0.55rem 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(28, 36, 44, 0.08);
    }

    .icon-btn.danger {
      color: #8f1f36;
      background: rgba(212, 69, 95, 0.12);
    }

    .drag-handle {
      cursor: grab;
    }

    .dragging {
      opacity: 0.45;
    }

    .category-body,
    .subcategory,
    .items-stack,
    .schedule-columns,
    .schedule-list,
    .task-list,
    .tag-manager,
    .tag-wrap,
    .links-row,
    .outfit-row {
      display: grid;
      gap: 0.7rem;
    }

    .subcategory {
      padding: 0.8rem;
      border-radius: var(--radius-md);
      border: 1px dashed rgba(28, 36, 44, 0.14);
      background: rgba(255, 255, 255, 0.54);
    }

    .items-stack {
      min-height: 56px;
    }

    .empty-box {
      display: grid;
      place-items: center;
      min-height: 56px;
      padding: 0.85rem;
      text-align: center;
      color: var(--muted);
      border-radius: var(--radius-md);
      border: 1px dashed rgba(28, 36, 44, 0.14);
      background: rgba(255, 255, 255, 0.35);
    }

    .item-card,
    .schedule-item {
      display: grid;
      gap: 0.7rem;
      padding: 0.9rem;
      border-radius: 18px;
      border: 1px solid rgba(28, 36, 44, 0.1);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 16px rgba(31, 42, 55, 0.05);
    }

    .item-card[draggable="true"] {
      cursor: grab;
    }

    .schedule-item.draggable {
      cursor: grab;
    }

    .item-card.priority-red,
    .schedule-item.priority-red {
      box-shadow: inset 4px 0 0 var(--red), 0 8px 16px rgba(31, 42, 55, 0.05);
    }

    .item-card.priority-yellow,
    .schedule-item.priority-yellow {
      box-shadow: inset 4px 0 0 var(--yellow), 0 8px 16px rgba(31, 42, 55, 0.05);
    }

    .item-card.priority-green,
    .schedule-item.priority-green {
      box-shadow: inset 4px 0 0 var(--green), 0 8px 16px rgba(31, 42, 55, 0.05);
    }

    .item-head h4 {
      font-size: 1.05rem;
      line-height: 1.25;
    }

    .meta-row,
    .tag-wrap,
    .links-row,
    .outfit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }

    .priority-pill.red {
      background: rgba(212, 69, 95, 0.12);
      color: var(--red);
    }

    .priority-pill.yellow {
      background: rgba(211, 159, 14, 0.14);
      color: #996f00;
    }

    .priority-pill.green {
      background: rgba(25, 155, 104, 0.12);
      color: var(--green);
    }

    .tag {
      --tag-color: #d8e7e4;
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      padding: 0.36rem 0.72rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--tag-color) 60%, white 40%);
      background: color-mix(in srgb, var(--tag-color) 22%, white 78%);
      font-size: 0.83rem;
      font-weight: 700;
    }

    .tag.clickable {
      cursor: pointer;
    }

    .source-pill {
      background: rgba(28, 36, 44, 0.08);
      color: var(--muted);
      font-weight: 600;
    }

    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.42rem 0.75rem;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.08);
      color: var(--accent-strong);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .schedule-columns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }

    .schedule-panel {
      padding: 0.85rem;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(28, 36, 44, 0.09);
      background: rgba(255, 255, 255, 0.68);
    }

    .schedule-panel h3 {
      margin-bottom: 0.7rem;
      font-size: 1rem;
    }

    .sidebar {
      display: grid;
      gap: 1rem;
      position: sticky;
      top: 1rem;
    }

    .sidebar .panel {
      padding: 1rem;
    }

    .panel-head {
      margin-bottom: 0.85rem;
    }

    .inline-form,
    .task-row,
    .tag-manager-row,
    .dialog-actions,
    .checkline {
      display: flex;
      gap: 0.55rem;
      align-items: center;
    }

    .inline-form {
      margin-bottom: 0.9rem;
    }

    .task-row {
      justify-content: space-between;
      padding: 0.7rem 0.8rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(28, 36, 44, 0.08);
    }

    .task-row.done {
      opacity: 0.75;
    }

    .task-row.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .checkline input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .task-actions {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .tag-manager-row {
      justify-content: space-between;
      padding: 0.7rem 0.8rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(28, 36, 44, 0.08);
    }

    .tag-manager-row input[type="color"] {
      width: 44px;
      height: 34px;
      border: 0;
      padding: 0;
      background: none;
    }

    .helper-box {
      padding: 0.85rem;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(217, 119, 69, 0.1), rgba(255, 255, 255, 0.55));
      color: #5b4a32;
      line-height: 1.6;
    }

    dialog {
      width: min(720px, calc(100% - 1rem));
      border: 0;
      padding: 0;
      border-radius: 28px;
      background: rgba(255, 252, 247, 0.98);
      box-shadow: 0 25px 70px rgba(22, 27, 33, 0.28);
    }

    dialog::backdrop {
      background: rgba(18, 24, 31, 0.36);
      backdrop-filter: blur(8px);
    }

    .dialog-shell {
      display: grid;
      gap: 0.9rem;
      padding: 0.7rem;
    }

    .dialog-grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .dialog-grid .full {
      grid-column: 1 / -1;
    }

    .checkstack {
      display: grid;
      gap: 0.55rem;
    }

    .field label {
      font-weight: 700;
    }

    .footnote {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    body.compact .topbar,
    body.compact .board-panel,
    body.compact .sidebar .panel,
    body.compact .category-card,
    body.compact .item-card,
    body.compact .schedule-item {
      padding: 0.8rem;
    }

    body.compact .btn {
      min-height: 38px;
      padding: 0.62rem 0.88rem;
    }

    body.compact .input,
    body.compact .select {
      min-height: 40px;
      padding: 0.62rem 0.82rem;
    }

    @media (max-width: 1160px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
    }

    @media (max-width: 860px) {
      .schedule-columns,
      .dialog-grid {
        grid-template-columns: 1fr;
      }

      .shell {
        width: min(100% - 1rem, 1500px);
      }
    }

    @media (max-width: 620px) {
      .title-row,
      .header-actions,
      .filters-row,
      .item-head,
      .category-top,
      .subcat-head,
      .panel-head,
      .task-row,
      .tag-manager-row,
      .dialog-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .category-actions,
      .item-actions,
      .subcat-actions,
      .task-actions {
        justify-content: flex-start;
      }

      .inline-form {
        flex-direction: column;
      }
    }
    /* Surface tone updates */
    :root {
      --bg: #f6f0ff;
      --bg-2: #fcf9ff;
      --ink: #24183f;
      --muted: #6f6790;
      --line: rgba(91, 33, 182, 0.14);
      --card: rgba(255, 255, 255, 0.92);
      --card-strong: rgba(255, 255, 255, 0.98);
      --shadow: 0 18px 42px rgba(76, 39, 143, 0.14);
      --accent: #7c3aed;
      --accent-strong: #5b21b6;
      --warm: #a855f7;
      --warm-strong: #7e22ce;
      --chip: rgba(124, 58, 237, 0.09);
      --published: rgba(236, 72, 153, 0.13);
      --ready: rgba(34, 197, 94, 0.14);
      --idea: rgba(124, 58, 237, 0.08);
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.22), transparent 34%),
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.18), transparent 32%),
        linear-gradient(180deg, #f8f3ff 0%, #f1ebff 52%, #ece5fb 100%);
    }

    .shell {
      width: min(100%, 760px);
      padding: 0.75rem 0.75rem 2rem;
    }

    .sidebar .panel {
      border-color: rgba(255, 255, 255, 0.48);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(248, 244, 255, 0.92));
      box-shadow: var(--shadow);
    }

    .title-row,
    .header-actions,
    .filters-row,
    .stats-strip,
    .progress-row,
    .workspace,
    .sidebar,
    .board-grid,
    .schedule-columns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .title-block h1 {
      font-size: clamp(1.55rem, 8vw, 2.35rem);
      line-height: 1.05;
    }

    .title-block .subtitle {
      max-width: none;
      font-size: 0.93rem;
      line-height: 1.5;
    }

    .btn,
    .icon-btn,
    .mini-btn {
      min-height: 38px;
      padding: 0.68rem 0.85rem;
      border-radius: 14px;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      justify-content: center;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 12px 24px rgba(91, 33, 182, 0.2);
    }

    .btn.warm {
      background: linear-gradient(135deg, var(--warm), var(--warm-strong));
      box-shadow: 0 12px 24px rgba(126, 34, 206, 0.2);
    }

    .btn.ghost,
    .icon-btn,
    .mini-btn {
      border: 1px solid rgba(91, 33, 182, 0.1);
      background: rgba(124, 58, 237, 0.06);
    }

    .btn.active {
      background: rgba(124, 58, 237, 0.16);
      border-color: rgba(124, 58, 237, 0.22);
    }

    .stats-strip {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat-card {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 0.8rem 0.9rem;
      border-radius: 18px;
    }

    .stat-card strong {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1;
    }

    .stat-card span {
