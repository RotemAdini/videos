        commit();
      }

      function reorderCategories(draggedId, targetId) {
        if (draggedId === targetId) {
          return;
        }

        const categories = [...state.board.categories];
        const fromIndex = categories.findIndex((category) => category.id === draggedId);
        const targetIndex = categories.findIndex((category) => category.id === targetId);
        if (fromIndex < 0 || targetIndex < 0) {
          return;
        }

        const [moved] = categories.splice(fromIndex, 1);
        const insertAt = fromIndex < targetIndex ? targetIndex - 1 : targetIndex;
        categories.splice(insertAt, 0, moved);
        state.board.categories = categories;
      }

      function moveBoardItem({ itemId, fromCategoryId, toCategoryId, beforeItemId, targetSubcat }) {
        if (!itemId || !fromCategoryId || !toCategoryId) {
          return;
        }

        if (beforeItemId === itemId && fromCategoryId === toCategoryId) {
          return;
        }

        const fromCategory = findCategory(fromCategoryId);
        const toCategory = findCategory(toCategoryId);
        if (!fromCategory || !toCategory) {
          return;
        }

        const itemIndex = fromCategory.items.findIndex((item) => item.id === itemId);
        if (itemIndex < 0) {
          return;
        }

        const [item] = fromCategory.items.splice(itemIndex, 1);
        item.subcat = toCategory.subcategories.some((subcat) => subcat.id === targetSubcat) ? targetSubcat : null;

        let insertAt = toCategory.items.length;
        if (beforeItemId) {
          const targetIndex = toCategory.items.findIndex((entry) => entry.id === beforeItemId);
          if (targetIndex >= 0) {
            insertAt = targetIndex;
          }
        }

        toCategory.items.splice(insertAt, 0, item);
      }

      function reorderSchedule(itemId, beforeItemId) {
        if (!itemId) {
          return;
        }

        if (beforeItemId === itemId) {
          return;
        }

        const order = getScheduleManualOrder().filter((id) => id !== itemId);
        const insertIndex = beforeItemId ? order.indexOf(beforeItemId) : -1;

        if (insertIndex >= 0) {
          order.splice(insertIndex, 0, itemId);
        } else {
          order.push(itemId);
        }

        state.board.scheduleManual = order;
      }

          message
        };

        showUndoToast._timer = window.setTimeout(() => {

          render();

      function clearFilterChip(filterKey) {

      function renameTagGlobally(tag) {
        if (!tag) {
          return;
        }
        const nextTag = window.prompt("שם חדש לתגית:", tag);
        if (!nextTag) {
          return;
        }
        const cleanTag = normalizeTagName(nextTag);
        if (!cleanTag || cleanTag === tag) {
          return;
        }

        state.board.categories.forEach((category) => {
          category.items.forEach((item) => {
            if (!item.tags || !item.tags.length) {
              return;
            }
            item.tags = item.tags.map((entry) => entry === tag ? cleanTag : entry);
            item.tags = normalizeTagList(item.tags);
          });
        });

        if (state.board.tagColors[tag]) {
          state.board.tagColors[cleanTag] = state.board.tagColors[cleanTag] || state.board.tagColors[tag];
          delete state.board.tagColors[tag];
        }

        if (state.filters.tag === tag) {
          state.filters.tag = cleanTag;
        }

        commit();
        showNoticeToast(`התגית "${tag}" שונתה ל־"${cleanTag}"`);
      }

      function findCalendarDate(dateId) {
        return (state.board.calendarDates || []).find((entry) => entry.id === dateId) || null;
      }

      function saveCalendarDateFromForm(form) {
        const formData = new FormData(form);
        const date = normalizeDateValue(formData.get("date"));
        const title = String(formData.get("title") || "").trim();
        const type = normalizeCalendarDateType(formData.get("type"));
        if (!date || !title) {
          return;
        }

        state.board.calendarDates.push({
          id: createId("date"),
          date,
          title,
          type
        });
        state.calendarFocusDate = date;
        commit();
        showNoticeToast(type === "filming-day" ? `סומן יום צילום ב־${formatDate(date)}` : `נוסף אירוע ל־${formatDate(date)}`);
        renderCalendarDayDialog(date);
        const nextTitle = refs.dayContent.querySelector("input[name='title']");
        const nextType = refs.dayContent.querySelector("select[name='type']");
        if (nextTitle) {
          nextTitle.value = "";
          nextTitle.focus();
        }
        if (nextType) {
          nextType.value = "note";

      }

      function editCalendarDate(dateId) {

          return;

        const nextTitle = window.prompt("עריכת תאריך חשוב:", entry.title);

          return;
        }
        const cleanTitle = nextTitle.trim();
        if (!cleanTitle) {

        entry.title = cleanTitle;

        commit();
        if (state.calendarDayDate === entry.date) {
          renderCalendarDayDialog(entry.date);

        showNoticeToast("התאריך החשוב עודכן");

      function deleteCalendarDate(dateId) {
        const entry = findCalendarDate(dateId);

          return;

        const snapshot = cloneBoard(state.board);
        state.board.calendarDates = state.board.calendarDates.filter((date) => date.id !== dateId);
        commit();
        showUndoToast(snapshot, `התאריך "${entry.title}" נמחק`);
      }

      function moveItemToNextStage(itemId, currentCategoryId = "") {
        const location = findItemLocation(itemId);
        if (!location) {
          return;
        }
        const hintedCategory = currentCategoryId ? findCategory(currentCategoryId) : null;
        const sourceCategory = hintedCategory && hintedCategory.items.some((item) => item.id === itemId)
          ? hintedCategory
          : location.category;
        const nextCategory = getNextStageCategory(sourceCategory.id);
        if (!nextCategory) {
          showNoticeToast("אין שלב הבא עבור הפריט הזה");
          return;
        }
        if (nextCategory.id === sourceCategory.id) {
          showNoticeToast("הפריט כבר נמצא בשלב הזה");
          return;
        }

        sourceCategory.items = sourceCategory.items.filter((item) => item.id !== itemId);
        location.item.subcat = null;
        nextCategory.items.push(location.item);
        commit();
        showNoticeToast(`"${location.item.title}" הועבר ל־${nextCategory.title}`);
      }

      function findCategory(categoryId) {
        return state.board.categories.find((category) => category.id === categoryId) || null;
      }

      function getNextStageCategory(categoryId) {
        const currentCategory = findCategory(categoryId);
        if (!currentCategory) {
          return null;
        }

        if (currentCategory.title === HOLD_TITLE) {
          return null;
        }

        if (currentCategory.title === DUBBING_TITLE) {
          return state.board.categories.find((category) => category.title === "עריכה בסיסית")
            || state.board.categories.find((category) => isReadyCategory(category))
            || state.board.categories.find((category) => isPublishedCategory(category))
            || null;
        }

        const workflowIndex = WORKFLOW_STAGE_TITLES.indexOf(currentCategory.title);
        if (workflowIndex >= 0) {
          for (let index = workflowIndex + 1; index < WORKFLOW_STAGE_TITLES.length; index += 1) {
            const nextWorkflowCategory = state.board.categories.find((category) => category.title === WORKFLOW_STAGE_TITLES[index]);
            if (nextWorkflowCategory) {
              return nextWorkflowCategory;
            }
          }
        }

        const currentIndex = state.board.categories.findIndex((category) => category.id === categoryId);
        if (currentIndex < 0) {
          return null;
        }

        for (let index = currentIndex + 1; index < state.board.categories.length; index += 1) {
          const nextCategory = state.board.categories[index];
          if (nextCategory.title !== HOLD_TITLE) {
            return nextCategory;
          }
        }

        return null;
      }

      function getCategoryIcon(category) {
        const title = String(category && category.title || "");
        if (category && category.role === "ready") {
          return "🚀";
        }
        if (category && category.role === "published") {
          return "✓";
        }
        if (title === "רעיונות") {
          return "✦";
        }
        if (title === "נקבע תאריך") {
          return "🗓";
        }
        if (title === "צילמנו") {
          return "🎥";
        }
        if (title === "עריכה בסיסית") {
          return "✂";
        }
        return "◌";
      }

      function getCategoryToneClass(category) {
        const title = String(category && category.title || "");
        if (category && category.role === "ready") {
          return "tone-ready";
        }
        if (category && category.role === "published") {
          return "tone-published";
        }
        if (title === HOLD_TITLE) {
          return "tone-hold";
        }
        if (title === "רעיונות") {
          return "tone-ideas";
        }
        if (title === "נקבע תאריך") {
          return "tone-scheduled";
        }
        if (title === "צילמנו") {
          return "tone-filmed";
        }
        if (title === DUBBING_TITLE) {
          return "tone-dubbing";
        }
        if (title === "עריכה בסיסית") {
          return "tone-edit";
        }
        return "tone-generic";
      }

      function getSubcategoryTitle(category, subcatId) {
        if (!category || !subcatId) {
          return "";
        }

        const subcategory = (category.subcategories || []).find((entry) => entry.id === subcatId);
        return subcategory ? subcategory.title : "";
      }

      function animateAccordionToggle(root, shell, body, collapsed) {
        if (!root || !shell || !body) {
          render();
          return;
        }

        const targetHeight = body.scrollHeight;
        shell.style.overflow = "hidden";
        shell.style.transition = "height 220ms ease, opacity 180ms ease";

        if (collapsed) {
          shell.classList.remove("collapsed");
          shell.style.height = `${targetHeight}px`;
          shell.style.opacity = "1";
          requestAnimationFrame(() => {
            root.classList.add("is-collapsed");
            shell.classList.add("collapsed");
            shell.style.height = "0px";
            shell.style.opacity = "0";
          });
        } else {
          root.classList.remove("is-collapsed");
          shell.classList.remove("collapsed");
          shell.style.height = "0px";
          shell.style.opacity = "0";
          requestAnimationFrame(() => {
            shell.style.height = `${targetHeight}px`;
            shell.style.opacity = "1";
          });
        }

        window.clearTimeout(animateAccordionToggle._timer);
        animateAccordionToggle._timer = window.setTimeout(() => {
          render();
        }, 240);
      }

      function cloneBoard(board) {
        if (typeof structuredClone === "function") {
          return structuredClone(board);
        }
        return JSON.parse(JSON.stringify(board));
      }

      function getTodayIso() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      function findItemLocation(itemId) {
        for (const category of state.board.categories) {
          const item = category.items.find((entry) => entry.id === itemId);
          if (item) {
            return { category, item };
          }
        }
        return null;
      }

      function isReadyCategory(category) {
        return category.role === "ready" || category.title === READY_TITLE;
      }

      function isPublishedCategory(category) {
        return category.role === "published" || category.title === PUBLISHED_TITLE;
      }

      function isScheduledCategory(category) {
        return Boolean(category && category.title === "נקבע תאריך");
      }

      function compareText(a, b) {
        return String(a || "").localeCompare(String(b || ""), "he", { sensitivity: "base", numeric: true });
      }

      function compareDates(a, b) {
        const first = parseDate(a);
        const second = parseDate(b);
        if (!first || !second) {
          return 0;
        }
        return first.getTime() - second.getTime();
      }

      function parseDate(value) {
        const date = normalizeDateValue(value);
        if (!date) {
          return null;
        }
        const [year, month, day] = date.split("-").map(Number);
        return new Date(year, month - 1, day, 12, 0, 0);
      }

      function formatDate(value) {
        const date = parseDate(value);
        return date ? DATE_FORMATTER.format(date) : "";
      }

      function getWeekday(value) {
        const date = parseDate(value);
        return date ? DAY_FORMATTER.format(date) : "";
      }

      function colorFromString(value) {
        let hash = 0;
        for (let i = 0; i < value.length; i += 1) {
          hash = value.charCodeAt(i) + ((hash << 5) - hash);
          hash |= 0;
        }
        const hue = Math.abs(hash) % 360;
        return hslToHex(hue, 68, 78);
      }

      function hslToHex(h, s, l) {
        s /= 100;
        l /= 100;
        const k = (n) => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = (n) => {
          const color = l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
          return Math.round(255 * color).toString(16).padStart(2, "0");
        };
        return `#${f(0)}${f(8)}${f(4)}`;
      }

      function sanitizeColor(value, fallback) {
        const color = String(value || "").trim();
        if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)) {
          return color;
        }
        if (/^rgba?\([\d\s.,%]+\)$/i.test(color) || /^hsla?\([\d\s.,%]+\)$/i.test(color)) {
          return color;
        }
        return fallback;
      }

      function hexColor(color) {
        if (/^#([0-9a-f]{6})$/i.test(color)) {
          return color;
        }
        return colorFromString(color);
      }

      function createId(prefix) {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return `${prefix}-${window.crypto.randomUUID()}`;
        }
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }
    })();
  </script>
</body>
